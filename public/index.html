<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DarkSound - Mobile Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #0a0a0f;
            --glass-surface: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-green: #1ed760;
            --neon-glow: 0 0 25px rgba(30, 215, 96, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 0%, rgba(30, 215, 96, 0.07) 0%, transparent 60%);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 16px 20px 10px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: var(--bg-deep);
            z-index: 10;
        }

        .app-title {
            font-size: 1.4rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .app-title i {
            color: var(--neon-green);
            filter: drop-shadow(0 0 8px var(--neon-green));
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            background: var(--glass-surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 14px 16px 14px 46px;
            border-radius: 500px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--neon-green);
            box-shadow: var(--neon-glow);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px 160px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .track-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .track-item {
            background: var(--glass-surface);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 10px 14px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .track-item:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.08);
        }

        .track-item img {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            object-fit: cover;
        }

        .track-meta {
            flex: 1;
            min-width: 0;
        }

        .track-meta h4 {
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .track-meta p {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-item .fa-play {
            color: var(--neon-green);
            font-size: 0.9rem;
            padding: 10px;
        }

        .mobile-player {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: rgba(20, 20, 30, 0.88);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            z-index: 100;
            display: none;
        }

        .player-main {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mobile-player img {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            object-fit: cover;
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        .player-info .p-title {
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-info .p-artist {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-actions {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 1.3rem;
            color: var(--text-main);
        }

        .player-actions i {
            cursor: pointer;
        }

        .player-actions .fa-play-circle, .player-actions .fa-pause-circle {
            font-size: 2.3rem;
            color: var(--neon-green);
            filter: drop-shadow(0 0 10px rgba(30, 215, 96, 0.4));
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--neon-green);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <header>
        <div class="app-title">
            <i class="fab fa-spotify"></i> DarkSound
        </div>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Cerca brano, artista o album..." onkeydown="handleSearch(event)">
        </div>
    </header>

    <main>
        <h2 class="section-title" id="sectionTitle">Esplora la musica</h2>
        <div class="track-list" id="trackListContainer">
            <p style="color: var(--text-muted); text-align:center; padding: 30px; font-size: 0.9rem;">
                Digita il nome di un brano nella barra in alto e premi invio per avviare la ricerca.
            </p>
        </div>
    </main>

    <div class="mobile-player" id="mobilePlayer">
        <div class="player-main">
            <img id="playerImg" src="" alt="Cover">
            <div class="player-info">
                <div class="p-title" id="playerTitle">Titolo</div>
                <div class="p-artist" id="playerArtist">Artista</div>
            </div>
            <div class="player-actions">
                <i class="fas fa-play-circle" id="playPauseIcon" onclick="togglePlay()"></i>
            </div>
        </div>
        <div class="progress-bar-container" onclick="seekAudio(event)">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <script>
        const audio = new Audio();
        let currentTracks = [];

        async function handleSearch(e) {
            if (e.key === 'Enter') {
                const query = e.target.value.trim();
                if (!query) return;

                document.getElementById('sectionTitle').innerText = "Risultati della ricerca";
                const container = document.getElementById('trackListContainer');
                container.innerHTML = `
                    <div style="text-align:center; padding: 40px; color: var(--text-muted);">
                        <i class="fas fa-spinner fa-spin" style="font-size: 1.8rem; color: var(--neon-green); margin-bottom: 10px;"></i>
                        <p>Ricerca in corso...</p>
                    </div>
                `;

                try {
                    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                    currentTracks = await res.json();
                    renderList(currentTracks);
                } catch (err) {
                    console.error(err);
                    container.innerHTML = `<p style="color: #ff4d4d; text-align:center; padding: 20px;">Errore di connessione al server.</p>`;
                }
            }
        }

        function renderList(list) {
            const container = document.getElementById('trackListContainer');
            container.innerHTML = '';
            
            if (list.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align:center; padding: 20px;">Nessun brano trovato</p>`;
                return;
            }

            list.forEach((track, index) => {
                container.innerHTML += `
                    <div class="track-item" onclick="playTrack(${index})">
                        <img src="${track.image}" alt="${track.name}">
                        <div class="track-meta">
                            <h4>${track.name}</h4>
                            <p>${track.artist_name}</p>
                        </div>
                        <i class="fas fa-play"></i>
                    </div>
                `;
            });
        }

        async function playTrack(index) {
            const track = currentTracks[index];
            const player = document.getElementById('mobilePlayer');
            player.style.display = 'flex';

            document.getElementById('playerImg').src = track.image;
            document.getElementById('playerTitle').innerText = track.name;
            document.getElementById('playerArtist').innerText = track.artist_name;
            document.getElementById('playPauseIcon').className = 'fas fa-spinner fa-spin';

            audio.src = `/api/stream/${track.id}`;
            try {
                await audio.play();
                document.getElementById('playPauseIcon').className = 'fas fa-pause-circle';
            } catch (err) {
                console.error("Errore riproduzione:", err);
                document.getElementById('playPauseIcon').className = 'fas fa-play-circle';
            }
        }

        function togglePlay() {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
                document.getElementById('playPauseIcon').className = 'fas fa-pause-circle';
            } else {
                audio.pause();
                document.getElementById('playPauseIcon').className = 'fas fa-play-circle';
            }
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progressBar').style.width = progressPercent + '%';
            }
        });

        function seekAudio(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            if (audio.duration) {
                audio.currentTime = (clickX / width) * audio.duration;
            }
        }
    </script>
</body>
</html>
