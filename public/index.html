<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DarkSound - Spotify Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #000000;
            --bg-card: #121212;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --accent: #1ed760;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            padding-bottom: 140px;
            min-height: 100vh;
        }

        /* --- LOGIN / REGISTER VIEW --- */
        #view-login {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #121212 0%, #000000 100%);
            z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center;
        }
        #view-login h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 5px; color: var(--accent); }
        #view-login p { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 25px; }
        .login-card { background: rgba(255, 255, 255, 0.05); padding: 24px; border-radius: 12px; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .login-input { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); padding: 12px 16px; border-radius: 8px; color: white; font-size: 0.95rem; outline: none; width: 100%; }
        .login-btn { background: var(--accent); color: black; font-weight: 700; border: none; padding: 12px; border-radius: 500px; cursor: pointer; font-size: 0.95rem; margin-top: 5px; transition: opacity 0.2s; }
        .login-btn:active { opacity: 0.8; }
        .auth-switch { font-size: 0.8rem; color: var(--text-sub); margin-top: 10px; cursor: pointer; }
        .auth-switch span { color: var(--text-main); font-weight: 600; text-decoration: underline; }

        .view { display: none; padding: 20px; }
        .view.active { display: block; }

        .top-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #555; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; color: white; cursor: pointer; overflow: hidden; }
        .header-title { font-size: 1.5rem; font-weight: 800; }

        .search-box { background: var(--bg-card); padding: 12px 16px; border-radius: 500px; display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .search-box input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 1rem; }

        .grid-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 24px; }
        .grid-card { background: rgba(255,255,255,0.07); border-radius: 6px; display: flex; align-items: center; gap: 10px; overflow: hidden; cursor: pointer; transition: background 0.2s; }
        .grid-card:active { background: rgba(255,255,255,0.15); }
        .grid-card img { width: 56px; height: 56px; object-fit: cover; background: #222; }
        .grid-card span { font-size: 0.85rem; font-weight: 700; padding-right: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; margin-top: 24px; display: flex; justify-content: space-between; align-items: center; }
        .tracks-column { display: flex; flex-direction: column; gap: 4px; }

        .track-item { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 4px; cursor: pointer; justify-content: space-between; }
        .track-item:hover { background: rgba(255,255,255,0.1); }
        .track-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
        .track-item img { width: 48px; height: 48px; border-radius: 4px; object-fit: cover; background: #222; }
        .track-item-info { flex: 1; min-width: 0; }
        .track-item h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-item p { font-size: 0.75rem; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-actions { display: flex; gap: 14px; align-items: center; color: var(--text-sub); font-size: 1rem; }

        .visualizer { display: flex; align-items: flex-end; gap: 2px; height: 14px; margin-right: 5px; }
        .bar { width: 3px; background: var(--accent); animation: pulse 0.8s infinite ease-in-out; }
        .bar:nth-child(1) { animation-delay: 0.1s; } .bar:nth-child(2) { animation-delay: 0.3s; } .bar:nth-child(3) { animation-delay: 0.5s; }
        @keyframes pulse { 0%, 100% { height: 4px; } 50% { height: 14px; } }
        .hidden { display: none !important; }

        /* MINI PLAYER BAR */
        .player-bar {
            position: fixed; bottom: 60px; left: 8px; right: 8px; background: #181818; border-radius: 8px; padding: 10px 12px;
            display: none; align-items: center; gap: 12px; z-index: 999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); cursor: pointer; border: 1px solid rgba(255,255,255,0.05);
        }
        .player-bar img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; background: #222; }
        .player-meta { flex: 1; min-width: 0; }
        .player-meta .p-title { font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-meta .p-artist { font-size: 0.75rem; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-icons { display: flex; align-items: center; gap: 15px; font-size: 1.2rem; }

        /* FULLSCREEN PLAYER */
        .fullscreen-player {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #53385a 0%, #121212 50%, #000000 100%);
            z-index: 2000; display: none; flex-direction: column; padding: 30px 20px 40px 20px; justify-content: space-between;
        }
        .fs-header { display: flex; justify-content: space-between; align-items: center; color: white; font-size: 1.2rem; }
        .fs-header span { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        
        .fs-content { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .fs-cover { width: 100%; max-width: 320px; aspect-ratio: 1/1; border-radius: 8px; object-fit: cover; background: #222; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        .fs-info-row { width: 100%; max-width: 320px; display: flex; justify-content: space-between; align-items: center; }
        .fs-titles h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fs-titles p { font-size: 0.95rem; color: var(--text-sub); width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .fs-progress { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 6px; }
        .fs-slider { width: 100%; -webkit-appearance: none; background: rgba(255,255,255,30%); height: 5px; border-radius: 3px; outline: none; cursor: pointer; accent-color: var(--accent); }
        .fs-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: white; cursor: pointer; }
        .fs-times { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-sub); }

        .fs-controls { width: 100%; max-width: 320px; display: flex; justify-content: space-between; align-items: center; font-size: 1.3rem; color: white; margin-top: 5px; }
        .fs-controls .main-play { width: 64px; height: 64px; background: white; color: black; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; }
        .active-btn { color: var(--accent) !important; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: #222; width: 100%; max-width: 300px; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .modal-card h3 { font-size: 1.1rem; margin-bottom: 5px; color: white; }
        .playlist-option { padding: 10px; background: #333; border-radius: 6px; cursor: pointer; font-size: 0.9rem; text-align: center; color: white; }

        #youtube-player { display: none; }

        nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: rgba(18,18,18,0.95);
            display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-sub); font-size: 0.7rem; font-weight: 600; cursor: pointer; background: none; border: none; }
        .nav-item i { font-size: 1.2rem; }
        .nav-item.active { color: var(--text-main); }
    </style>
</head>
<body>

    <!-- LOGIN / REGISTRATION VIEW -->
    <div id="view-login">
        <h1 id="authTitle">DarkSound</h1>
        <p id="authSubtitle">Accedi per ascoltare la tua musica</p>
        <div class="login-card">
            <input type="email" id="loginEmail" class="login-input" placeholder="La tua email">
            <input type="password" id="loginPassword" class="login-input" placeholder="Password">
            <button class="login-btn" id="authSubmitBtn" onclick="handleAuthSubmit()">Accedi</button>
            <div class="auth-switch" id="authSwitchText" onclick="toggleAuthMode()">
                Non hai un account? <span>Registrati</span>
            </div>
        </div>
    </div>

    <!-- HOME VIEW -->
    <div id="view-home" class="view active">
        <div class="top-header">
            <div class="user-avatar" id="userAvatarContainer" onclick="logout()" title="Esci">U</div>
            <div class="header-title">In evidenza</div>
        </div>
        <div class="grid-cards">
            <div class="grid-card" onclick="quickPlay('Geolier')">
                <img src="https://i.ytimg.com/vi/324_93wW3lY/hqdefault.jpg" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150'">
                <span>Geolier Mix</span>
            </div>
            <div class="grid-card" onclick="quickPlay('Ultimo')">
                <img src="https://i.ytimg.com/vi/w1m1rK50C0Y/hqdefault.jpg" onerror="this.src='https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=150'">
                <span>Ultimo Hit</span>
            </div>
        </div>
        <div class="section-title">Brani Consigliati</div>
        <div id="homePopList" class="tracks-column"></div>
    </div>

    <!-- SEARCH VIEW -->
    <div id="view-search" class="view">
        <div class="top-header"><div class="header-title">Cerca</div></div>
        <div class="search-box">
            <i class="fas fa-search" style="color: var(--text-sub);"></i>
            <input type="text" id="searchInput" placeholder="Cosa vuoi ascoltare?" onkeydown="if(event.key==='Enter') searchTracks()">
        </div>
        <div id="searchResults"></div>
    </div>

    <!-- LIBRARY VIEW -->
    <div id="view-library" class="view">
        <div class="top-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div class="user-avatar" id="libAvatarContainer">U</div>
                <div class="header-title">La tua libreria</div>
            </div>
            <i class="fas fa-plus" style="font-size: 1.2rem; cursor:pointer;" onclick="createPlaylist()" title="Crea Playlist"></i>
        </div>
        
        <div class="section-title">Brani Preferiti ❤️</div>
        <div id="likedTracksContainer" class="tracks-column"></div>

        <div class="section-title">Le tue Playlist 📁</div>
        <div id="playlistsContainer" class="tracks-column"></div>
    </div>

    <!-- MODALE PLAYLIST -->
    <div class="modal-overlay" id="playlistModal" onclick="closePlaylistModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h3>Aggiungi a playlist</h3>
            <div id="modalPlaylistsList" style="display:flex; flex-direction:column; gap:8px; max-height: 200px; overflow-y:auto;"></div>
            <button onclick="document.getElementById('playlistModal').style.display='none'" style="background:#444; border:none; color:white; padding:8px; border-radius:6px; cursor:pointer; margin-top:5px;">Annulla</button>
        </div>
    </div>

    <!-- YOUTUBE ENGINE -->
    <div id="youtube-player"></div>

    <!-- MINI PLAYER BAR -->
    <div class="player-bar" id="playerBar" onclick="openFullscreenPlayer()">
        <img id="playerImg" src="" alt="" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150'">
        <div class="player-meta">
            <div class="p-title" id="playerTitle">-</div>
            <div class="p-artist" id="playerArtist">-</div>
        </div>
        <div class="visualizer hidden" id="visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="player-icons" onclick="event.stopPropagation()">
            <i class="fas fa-heart" id="miniLikeBtn" style="color: var(--text-sub); cursor:pointer;" onclick="toggleLikeCurrentTrack()"></i>
            <i class="fas fa-play" id="playPauseIcon" style="cursor:pointer;" onclick="togglePlay()"></i>
        </div>
    </div>

    <!-- FULLSCREEN PLAYER -->
    <div class="fullscreen-player" id="fullscreenPlayer">
        <div class="fs-header">
            <i class="fas fa-chevron-down" onclick="closeFullscreenPlayer()" style="cursor: pointer;"></i>
            <span>DarkSound Player</span>
            <i class="fas fa-ellipsis-h" style="cursor: pointer;" onclick="alert('Opzioni')"></i>
        </div>
        <div class="fs-content">
            <img class="fs-cover" id="fsCover" src="" alt="" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300'">
            <div class="fs-info-row">
                <div class="fs-titles">
                    <h2 id="fsTitle">-</h2>
                    <p id="fsArtist">-</p>
                </div>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <i class="fas fa-plus-circle" style="font-size: 1.4rem; color: var(--text-sub); cursor:pointer;" onclick="openModalForTrack(currentTrackData)" title="Aggiungi a playlist"></i>
                    <i class="fas fa-heart" id="fsLikeBtn" style="font-size: 1.5rem; color: var(--text-sub); cursor:pointer;" onclick="toggleLikeCurrentTrack()"></i>
                </div>
            </div>
            
            <div class="fs-progress">
                <input type="range" id="fsSeekBar" class="fs-slider" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)">
                <div class="fs-times">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>

            <div class="fs-controls">
                <i class="fas fa-random" id="shuffleBtn" style="cursor:pointer;" onclick="toggleShuffle()"></i>
                <i class="fas fa-step-backward" style="cursor: pointer;" onclick="alert('Traccia precedente')"></i>
                <div class="main-play" onclick="togglePlay()">
                    <i class="fas fa-play" id="fsPlayPauseIcon" style="color: black;"></i>
                </div>
                <i class="fas fa-step-forward" style="cursor: pointer;" onclick="alert('Traccia successiva')"></i>
                <i class="fas fa-redo" id="repeatBtn" style="cursor:pointer;" onclick="toggleRepeat()"></i>
            </div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; color: var(--text-sub); font-size: 1.1rem;">
            <i class="fas fa-laptop" style="cursor:pointer;" onclick="alert('Web Browser')"></i>
            <i class="fas fa-share-alt" style="cursor:pointer;" onclick="alert('Link copiato!')"></i>
            <i class="fas fa-bars" style="cursor:pointer;" onclick="alert('Coda di riproduzione')"></i>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav>
        <button class="nav-item active" onclick="switchView('home', this)"><i class="fas fa-home"></i><span>Home</span></button>
        <button class="nav-item" onclick="switchView('search', this)"><i class="fas fa-search"></i><span>Cerca</span></button>
        <button class="nav-item" onclick="switchView('library', this)"><i class="fas fa-stream"></i><span>Libreria</span></button>
    </nav>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player, isPlaying = false, progressInterval, currentTrackData = null, trackToAddToPlaylist = null;
        let isPlayerReady = false, pendingTrack = null;
        let isShuffle = false, isRepeat = false;
        let isRegisterMode = false;
        const defaultCover = 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150';

        let appData = JSON.parse(localStorage.getItem('darksound_session')) || {
            currentUser: null,
            usersDb: {},
            likedTracks: [],
            playlists: []
        };

        window.onload = function() {
            if (appData.currentUser) {
                document.getElementById('view-login').style.display = 'none';
                updateUserUI();
                initAppData();
                renderLibrary();
            }
        };

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('authTitle').innerText = isRegisterMode ? 'Registrati' : 'DarkSound';
            document.getElementById('authSubtitle').innerText = isRegisterMode ? 'Crea un account gratuito' : 'Accedi per ascoltare la tua musica';
            document.getElementById('authSubmitBtn').innerText = isRegisterMode ? 'Registrati' : 'Accedi';
            document.getElementById('authSwitchText').innerHTML = isRegisterMode 
                ? 'Hai già un account? <span>Accedi</span>' 
                : 'Non hai un account? <span>Registrati</span>';
        }

        function handleAuthSubmit() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                alert("Inserisci email e password validi.");
                return;
            }

            if (!appData.usersDb) appData.usersDb = {};

            if (isRegisterMode) {
                if (appData.usersDb[email]) {
                    alert("Esiste già un account con questa email. Effettua l'accesso.");
                    return;
                }
                appData.usersDb[email] = {
                    password: password,
                    likedTracks: [],
                    playlists: []
                };
                alert("Registrazione completata con successo! Ora puoi accedere.");
                toggleAuthMode();
            } else {
                const userRecord = appData.usersDb[email];
                if (!userRecord || userRecord.password !== password) {
                    alert("Email o password errati.");
                    return;
                }
                appData.currentUser = email;
                appData.likedTracks = userRecord.likedTracks || [];
                appData.playlists = userRecord.playlists || [];
                saveSession();

                document.getElementById('view-login').style.display = 'none';
                updateUserUI();
                initAppData();
                renderLibrary();
            }
        }

        function logout() {
            if(confirm("Vuoi effettuare il logout?")) {
                appData.currentUser = null;
                saveSession();
                location.reload();
            }
        }

        function saveSession() {
            if (appData.currentUser && appData.usersDb[appData.currentUser]) {
                appData.usersDb[appData.currentUser].likedTracks = appData.likedTracks;
                appData.usersDb[appData.currentUser].playlists = appData.playlists;
            }
            localStorage.setItem('darksound_session', JSON.stringify(appData));
        }

        function updateUserUI() {
            if (!appData.currentUser) return;
            const initial = appData.currentUser.charAt(0).toUpperCase();
            document.getElementById('userAvatarContainer').innerText = initial;
            document.getElementById('libAvatarContainer').innerText = initial;
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0', width: '0',
                playerVars: { 'autoplay': 1, 'controls': 0, 'enablejsapi': 1 },
                events: { 
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange 
                }
            });
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
            if (pendingTrack) {
                playTrack(pendingTrack);
                pendingTrack = null;
            }
        }

        function onPlayerStateChange(event) {
            const viz = document.getElementById('visualizer');
            if (event.data === YT.PlayerState.PLAYING) {
                updateIcons(true); viz.classList.remove('hidden');
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                updateIcons(false); viz.classList.add('hidden');
            }
        }

        function switchView(viewName, btnElement) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + viewName).classList.add('active');
            if (btnElement) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                btnElement.classList.add('active');
            }
            if(viewName === 'library') renderLibrary();
        }

        async function initAppData() {
            try {
                const res = await fetch(`/api/search?q=hit+italiane+ufficiale`);
                let tracks = await res.json();
                const container = document.getElementById('homePopList');
                if (container && tracks.length > 0) {
                    container.innerHTML = tracks.slice(0, 5).map(t => createTrackHTML(t)).join('');
                }
            } catch (e) {}
        }

        async function quickPlay(query) {
            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                let tracks = await res.json();
                if (tracks.length > 0) playTrack(tracks[0]);
            } catch (e) {}
        }

        async function searchTracks() {
            const q = document.getElementById('searchInput').value.trim();
            if (!q) return;
            const container = document.getElementById('searchResults');
            container.innerHTML = `<p style="color:var(--text-sub); text-align:center; padding:20px;">Ricerca...</p>`;
            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
                let tracks = await res.json();
                container.innerHTML = `<div class="tracks-column">` + tracks.map(t => createTrackHTML(t)).join('') + `</div>`;
            } catch (e) {}
        }

        function createTrackHTML(t, extraActionHTML = '') {
            const safeImg = t.image || defaultCover;
            const tObj = JSON.stringify({id: t.id, name: t.name, artist: t.artist, image: safeImg}).replace(/"/g, '&quot;');
            
            return `
                <div class="track-item">
                    <div class="track-left" onclick="playTrack(${tObj})">
                        <img src="${safeImg}" onerror="this.src='${defaultCover}'">
                        <div class="track-item-info">
                            <h4>${t.name}</h4>
                            <p>${t.artist}</p>
                        </div>
                    </div>
                    <div class="track-actions">
                        <i class="fas fa-plus-circle" onclick='openModalForTrack(${tObj})' title="Aggiungi a playlist"></i>
                        ${extraActionHTML}
                    </div>
                </div>
            `;
        }

        function playTrack(t) {
            if (!isPlayerReady) {
                pendingTrack = t;
                showPlayerUI(t);
                return;
            }

            currentTrackData = t;
            showPlayerUI(t);

            if (player && player.loadVideoById) {
                player.loadVideoById(t.id);
                player.playVideo();
                startProgressTracker();
            }
        }

        function showPlayerUI(t) {
            const finalImg = t.image || defaultCover;
            document.getElementById('playerBar').style.display = 'flex';
            document.getElementById('playerTitle').innerText = t.name;
            document.getElementById('playerArtist').innerText = t.artist;
            document.getElementById('playerImg').src = finalImg;

            document.getElementById('fsTitle').innerText = t.name;
            document.getElementById('fsArtist').innerText = t.artist;
            document.getElementById('fsCover').src = finalImg;

            updateLikeButtonsUI();
        }

        function togglePlay() {
            if (!player || !player.getPlayerState) return;
            if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
            else player.playVideo();
        }

        function updateIcons(playing) {
            const iconClass = playing ? 'fas fa-pause' : 'fas fa-play';
            document.getElementById('playPauseIcon').className = iconClass;
            document.getElementById('fsPlayPauseIcon').className = iconClass;
        }

        function toggleLikeCurrentTrack() {
            if (!currentTrackData) return;
            const index = appData.likedTracks.findIndex(item => item.id === currentTrackData.id);
            if (index > -1) {
                appData.likedTracks.splice(index, 1);
            } else {
                appData.likedTracks.push(currentTrackData);
            }
            saveSession();
            updateLikeButtonsUI();
            renderLibrary();
        }

        function removeLikedTrack(id) {
            appData.likedTracks = appData.likedTracks.filter(item => item.id !== id);
            saveSession();
            renderLibrary();
            updateLikeButtonsUI();
        }

        function updateLikeButtonsUI() {
            if (!currentTrackData) return;
            const isLiked = appData.likedTracks.some(item => item.id === currentTrackData.id);
            const color = isLiked ? 'var(--accent)' : 'var(--text-sub)';
            document.getElementById('miniLikeBtn').style.color = color;
            document.getElementById('fsLikeBtn').style.color = color;
        }

        function renderLibrary() {
            const likedContainer = document.getElementById('likedTracksContainer');
            if (appData.likedTracks.length === 0) {
                likedContainer.innerHTML = `<p style="color: var(--text-sub); font-size: 0.85rem;">Nessun brano nei preferiti.</p>`;
            } else {
                likedContainer.innerHTML = appData.likedTracks.map(t => createTrackHTML(t, `<i class="fas fa-trash" style="color:#ff4d4d;" onclick="removeLikedTrack('${t.id}')" title="Rimuovi"></i>`)).join('');
            }

            const playlistContainer = document.getElementById('playlistsContainer');
            if (appData.playlists.length === 0) {
                playlistContainer.innerHTML = `<p style="color: var(--text-sub); font-size: 0.85rem;">Nessuna playlist creata.</p>`;
            } else {
                playlistContainer.innerHTML = appData.playlists.map((p, pIndex) => `
                    <div style="background:#121212; padding:12px; border-radius:8px; margin-bottom:10px; border:1px solid rgba(255,255,255,0.05);">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                            <h4 style="font-size:0.95rem; font-weight:700;"><i class="fas fa-music" style="color:var(--accent);"></i> ${p.name} (${p.tracks.length})</h4>
                            <i class="fas fa-trash" style="color:#ff4d4d; cursor:pointer;" onclick="deletePlaylist(${pIndex})" title="Elimina playlist"></i>
                        </div>
                        <div class="tracks-column">
                            ${p.tracks.length === 0 ? '<p style="color:var(--text-sub); font-size:0.75rem;">Playlist vuota</p>' : p.tracks.map((t, tIndex) => createTrackHTML(t, `<i class="fas fa-times" style="color:#ff4d4d;" onclick="removeTrackFromPlaylist(${pIndex}, ${tIndex})" title="Rimuovi"></i>`)).join('')}
                        </div>
                    </div>
                `).join('');
            }
        }

        function createPlaylist() {
            const name = prompt("Nome della nuova playlist:");
            if (name) {
                appData.playlists.push({ name: name, tracks: [] });
                saveSession();
                renderLibrary();
            }
        }

        function deletePlaylist(index) {
            if(confirm("Vuoi eliminare questa playlist?")) {
                appData.playlists.splice(index, 1);
                saveSession();
                renderLibrary();
            }
        }

        function removeTrackFromPlaylist(pIndex, tIndex) {
            appData.playlists[pIndex].tracks.splice(tIndex, 1);
            saveSession();
            renderLibrary();
        }

        function openModalForTrack(t) {
            trackToAddToPlaylist = t;
            const container = document.getElementById('modalPlaylistsList');
            if (appData.playlists.length === 0) {
                container.innerHTML = `<p style="color:var(--text-sub); font-size:0.85rem; text-align:center;">Nessuna playlist. Creane una dalla libreria!</p>`;
            } else {
                container.innerHTML = appData.playlists.map((p, idx) => `
                    <div class="playlist-option" onclick="addTrackToPlaylist(${idx})">${p.name}</div>
                `).join('');
            }
            document.getElementById('playlistModal').style.display = 'flex';
        }

        function addTrackToPlaylist(pIndex) {
            if (!trackToAddToPlaylist) return;
            const exists = appData.playlists[pIndex].tracks.some(item => item.id === trackToAddToPlaylist.id);
            if (!exists) {
                appData.playlists[pIndex].tracks.push(trackToAddToPlaylist);
                saveSession();
                renderLibrary();
                alert("Brano aggiunto alla playlist!");
            } else {
                alert("Il brano è già presente in questa playlist.");
            }
            document.getElementById('playlistModal').style.display = 'none';
        }

        function closePlaylistModal(e) {
            if(e.target.id === 'playlistModal') {
                document.getElementById('playlistModal').style.display = 'none';
            }
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffleBtn').classList.toggle('active-btn', isShuffle);
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById('repeatBtn').classList.toggle('active-btn', isRepeat);
        }

        function openFullscreenPlayer() { document.getElementById('fullscreenPlayer').style.display = 'flex'; }
        function closeFullscreenPlayer() { document.getElementById('fullscreenPlayer').style.display = 'none'; }

        function startProgressTracker() {
            if (progressInterval) clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (player && player.getCurrentTime && player.getDuration) {
                    const current = player.getCurrentTime();
                    const duration = player.getDuration() || 1;
                    const seekBar = document.getElementById('fsSeekBar');
                    seekBar.max = duration;
                    seekBar.value = current;
                    document.getElementById('currentTime').innerText = formatTime(current);
                    document.getElementById('totalTime').innerText = formatTime(duration);
                }
            }, 500);
        }

        function seekAudio(value) {
            if (player && player.seekTo) player.seekTo(parseFloat(value), true);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>
</html>
