<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DarkSound Pro - Redesign</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #060608;
            --bg-surface: rgba(255, 255, 255, 0.03);
            --bg-card: rgba(255, 255, 255, 0.05);
            --bg-card-hover: rgba(255, 255, 255, 0.09);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #a1a1aa;
            --accent: #30d158;
            --accent-glow: rgba(48, 209, 88, 0.35);
            --danger: #ff453a;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            font-size: 16px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(48, 209, 88, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(10, 132, 255, 0.08) 0%, transparent 45%);
            background-attachment: fixed;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background: #060608;
            z-index: 9999;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #splash-screen.fade-out { opacity: 0; visibility: hidden; }
        .splash-logo { 
            font-size: 3rem; 
            font-weight: 800; 
            color: var(--accent); 
            margin-bottom: 12px;
            text-shadow: 0 0 25px var(--accent-glow);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-bar {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 24px 20px;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
        .brand span { color: var(--accent); }
        .profile-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--bg-card); 
            border: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition);
            color: var(--text-main);
        }
        .profile-btn:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }

        .view {
            display: none; padding: 0 20px 220px 20px;
            animation: fadeIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 800px;
            margin: 0 auto;
        }
        .view.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            font-size: 1.4rem; font-weight: 800; margin: 24px 0 16px 0;
            display: flex; justify-content: space-between; align-items: center;
            letter-spacing: -0.3px;
        }

        .search-container {
            position: relative; margin-bottom: 24px;
        }
        .search-input {
            width: 100%; padding: 18px 20px 18px 52px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 18px; color: #fff; font-size: 1rem;
            outline: none; transition: var(--transition);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .search-input:focus { 
            border-color: var(--accent); 
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(48, 209, 88, 0.15);
        }
        .search-icon { 
            position: absolute; left: 20px; top: 50%; 
            transform: translateY(-50%); color: var(--text-sub); 
            font-size: 1.1rem;
        }

        .track-list { display: flex; flex-direction: column; gap: 10px; }
        .track-card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 14px; background: var(--bg-card);
            border-radius: 16px; border: 1px solid var(--border-light);
            cursor: pointer; transition: var(--transition);
        }
        .track-card:hover { 
            background: var(--bg-card-hover); 
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
        .track-card.active { 
            border-color: var(--accent); 
            background: rgba(48, 209, 88, 0.12);
            box-shadow: 0 4px 20px rgba(48, 209, 88, 0.1);
        }
        .track-info { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
        .track-img { width: 54px; height: 54px; border-radius: 12px; object-fit: cover; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .track-details { flex: 1; min-width: 0; }
        .track-title { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .track-artist { font-size: 0.82rem; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-actions { display: flex; gap: 12px; align-items: center; }
        .action-btn { 
            background: none; border: none; color: var(--text-sub); 
            font-size: 1.2rem; cursor: pointer; padding: 8px; 
            transition: var(--transition);
            border-radius: 50%;
        }
        .action-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .action-btn.liked { color: var(--danger); }

        .mini-player {
            position: fixed; bottom: 84px; left: 16px; right: 16px;
            max-width: 768px; margin: 0 auto;
            background: rgba(18, 18, 22, 0.85); 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px; padding: 10px 16px;
            display: none; align-items: center; gap: 14px;
            z-index: 1000; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .mini-player:active { transform: scale(0.98); }
        .mini-player.active { display: flex; }
        .mini-img { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
        .mini-details { flex: 1; min-width: 0; }
        .mini-title { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-artist { font-size: 0.78rem; color: var(--text-sub); margin-top: 2px; }
        .mini-controls { display: flex; align-items: center; gap: 16px; font-size: 1.25rem; }
        .mini-controls i { transition: var(--transition); padding: 6px; }
        .mini-controls i:hover { color: var(--accent); }

        .fs-player {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: linear-gradient(180deg, #12131a 0%, #060608 100%);
            z-index: 2000; display: flex; flex-direction: column; justify-content: space-between;
            padding: 48px 28px 36px 28px; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .fs-player.active { transform: translateY(0); }
        .fs-header { display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; color: var(--text-sub); }
        .fs-header i { cursor: pointer; transition: var(--transition); }
        .fs-header i:hover { color: #fff; }
        .fs-header span { font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-sub); }

        .fs-cover-container { 
            width: 100%; max-width: 320px; margin: 20px auto 0 auto; 
            aspect-ratio: 1; border-radius: 28px; overflow: hidden; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.8); 
            border: 1px solid var(--border-light);
        }
        .fs-cover { width: 100%; height: 100%; object-fit: cover; }
        
        .fs-meta { text-align: center; margin: 24px 0 10px 0; }
        .fs-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.3px; }
        .fs-artist { font-size: 1rem; color: var(--text-sub); font-weight: 500; }

        .progress-bar { 
            width: 100%; height: 6px; background: rgba(255,255,255,0.1); 
            border-radius: 10px; cursor: pointer; position: relative; 
            transition: height 0.2s ease;
        }
        .progress-bar:hover { height: 8px; }
        .progress-fill { width: 0%; height: 100%; background: var(--accent); border-radius: 10px; box-shadow: 0 0 12px var(--accent); }
        .time-stamps { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-sub); margin-top: 10px; font-weight: 600; }

        .fs-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; max-width: 360px; margin-left: auto; margin-right: auto; width: 100%; }
        .fs-controls i { color: var(--text-sub); transition: var(--transition); }
        .fs-controls i:hover { color: #fff; }
        .play-btn-lg { 
            width: 72px; height: 72px; border-radius: 50%; 
            background: var(--accent); color: #000; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 1.8rem; cursor: pointer; 
            box-shadow: 0 8px 25px var(--accent-glow);
            transition: var(--transition);
        }
        .play-btn-lg:hover { transform: scale(1.05); }
        .play-btn-lg:active { transform: scale(0.95); }
        .play-btn-lg i { color: #000 !important; }

        .drawer {
            position: fixed; top: 0; right: -100%; width: 85%; max-width: 360px; height: 100vh;
            background: rgba(14, 14, 18, 0.95); backdrop-filter: blur(25px);
            z-index: 3000; padding: 36px 24px; transition: right 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            box-shadow: -10px 0 40px rgba(0,0,0,0.8); border-left: 1px solid var(--border-light);
        }
        .drawer.active { right: 0; }
        .drawer-close { position: absolute; top: 24px; right: 24px; font-size: 1.4rem; cursor: pointer; color: var(--text-sub); transition: var(--transition); }
        .drawer-close:hover { color: #fff; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 72px;
            background: rgba(8, 8, 10, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-light);
            display: flex; justify-content: space-around; align-items: center; z-index: 900;
            max-width: 800px; margin: 0 auto;
        }
        .nav-link { 
            display: flex; flex-direction: column; align-items: center; gap: 5px; 
            color: var(--text-sub); text-decoration: none; font-size: 0.75rem; 
            font-weight: 600; background: none; border: none; cursor: pointer; 
            transition: var(--transition); width: 33%;
        }
        .nav-link.active { color: var(--accent); }
        .nav-link i { font-size: 1.25rem; }

        #youtube-player { position: fixed; top: -9999px; left: -9999px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-logo"><i class="fas fa-play-circle"></i> DarkSound</div>
        <p style="color: var(--text-sub); font-weight: 500;">Caricamento in corso...</p>
    </div>

    <div id="youtube-player"></div>

    <div class="top-bar">
        <div class="brand">Dark<span>Sound</span></div>
        <div class="profile-btn" onclick="toggleDrawer()"><i class="fas fa-user"></i></div>
    </div>

    <div id="view-home" class="view active">
        <div class="section-header">
            <span>Per Te</span>
        </div>
        <div class="track-list" id="homeList"></div>
    </div>

    <div id="view-search" class="view">
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-input" id="searchInput" placeholder="Cerca canzoni o artisti e premi Invio..." onkeyup="handleSearch(event)">
        </div>
        <div class="section-header">Risultati</div>
        <div class="track-list" id="searchList"></div>
    </div>

    <div id="view-likes" class="view">
        <div class="section-header">Brani che ti piacciono</div>
        <div class="track-list" id="likesList"></div>
    </div>

    <div class="mini-player" id="miniPlayer" onclick="openFullscreen()">
        <img src="" id="miniImg" class="mini-img">
        <div class="mini-details">
            <div class="mini-title" id="miniTitle">-</div>
            <div class="mini-artist" id="miniArtist">-</div>
        </div>
        <div class="mini-controls" onclick="event.stopPropagation()">
            <i class="fas fa-play" id="miniPlayBtn" onclick="togglePlay()"></i>
            <i class="fas fa-step-forward" onclick="nextTrack()"></i>
        </div>
    </div>

    <div class="fs-player" id="fsPlayer">
        <div class="fs-header">
            <i class="fas fa-chevron-down" onclick="closeFullscreen()"></i>
            <span>In Riproduzione</span>
            <i class="far fa-heart" id="fsLikeBtn" onclick="toggleLikeCurrent()"></i>
        </div>

        <div class="fs-cover-container">
            <img src="" id="fsImg" class="fs-cover">
        </div>

        <div class="fs-meta">
            <div class="fs-title" id="fsTitle">-</div>
            <div class="fs-artist" id="fsArtist">-</div>
        </div>

        <div>
            <div class="progress-bar" onclick="seekTrack(event)">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-stamps">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="fs-controls">
            <i class="fas fa-random" id="shuffleBtn" onclick="toggleShuffle()" style="cursor:pointer; font-size: 1.2rem;"></i>
            <i class="fas fa-step-backward" onclick="prevTrack()" style="font-size: 1.5rem; cursor:pointer;"></i>
            <div class="play-btn-lg" onclick="togglePlay()">
                <i class="fas fa-play" id="fsPlayBtn"></i>
            </div>
            <i class="fas fa-step-forward" onclick="nextTrack()" style="font-size: 1.5rem; cursor:pointer;"></i>
            <i class="fas fa-redo" id="repeatBtn" onclick="toggleRepeat()" style="cursor:pointer; font-size: 1.2rem;"></i>
        </div>
    </div>

    <div class="drawer" id="profileDrawer">
        <i class="fas fa-times drawer-close" onclick="toggleDrawer()"></i>
        <h2 style="margin-bottom: 24px; font-weight: 800;">Il tuo Profilo</h2>
        <div style="background: var(--bg-card); padding: 18px; border-radius: 16px; margin-bottom: 20px; border: 1px solid var(--border-light);">
            <p style="color: var(--text-sub); font-size: 0.8rem; font-weight: 600; text-transform: uppercase;">Brani Salvati</p>
            <h3 id="likedCount" style="font-size: 1.8rem; font-weight: 800; margin-top: 4px;">0</h3>
        </div>
        <p style="color: var(--text-sub); font-size: 0.85rem; line-height: 1.5;">DarkSound Pro Engine v3.0 - Integrazione API YouTube nativa senza dipendenze audio locali.</p>
    </div>

    <div class="bottom-nav">
        <button class="nav-link active" onclick="switchView('home', this)"><i class="fas fa-home"></i>Home</button>
        <button class="nav-link" onclick="switchView('search', this)"><i class="fas fa-search"></i>Cerca</button>
        <button class="nav-link" onclick="switchView('likes', this)"><i class="fas fa-heart"></i>Preferiti</button>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player = null;
        let isPlaying = false;
        let currentQueue = [];
        let currentIndex = -1;
        let likedTracks = JSON.parse(localStorage.getItem('darksound_likes')) || [];
        let isShuffle = false;
        let isRepeat = false;
        let updateTimer = null;

        const defaultTracks = [
            { id: 'dQw4w9WgXcQ', title: 'Never Gonna Give You Up', artist: 'Rick Astley', image: 'https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg' },
            { id: 'L_LUpnjgPso', title: 'Blinding Lights', artist: 'The Weeknd', image: 'https://img.youtube.com/vi/L_LUpnjgPso/hqdefault.jpg' },
            { id: 'kJQP7kiw5Fk', title: 'Despacito', artist: 'Luis Fonsi', image: 'https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg' },
            { id: 'fJ9rUzIMcZQ', title: 'Bohemian Rhapsody', artist: 'Queen', image: 'https://img.youtube.com/vi/fJ9rUzIMcZQ/hqdefault.jpg' }
        ];

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '1', width: '1',
                playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1 },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                updateControlsUI(true);
                startTimer();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                updateControlsUI(false);
                stopTimer();
            } else if (event.data === YT.PlayerState.ENDED) {
                if (isRepeat) {
                    player.playVideo();
                } else {
                    nextTrack();
                }
            }
        }

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('fade-out');
            }, 800);
            renderTrackList('homeList', defaultTracks);
            updateLikedCount();
        };

        function switchView(viewName, element) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            document.getElementById(`view-${viewName}`).classList.add('active');
            if(element) element.classList.add('active');

            if(viewName === 'likes') {
                renderTrackList('likesList', likedTracks);
            }
        }

        function renderTrackList(containerId, tracks) {
            const container = document.getElementById(containerId);
            if (!tracks || tracks.length === 0) {
                container.innerHTML = '<p style="color:var(--text-sub); padding:20px 0;">Nessun brano disponibile.</p>';
                return;
            }

            container.innerHTML = tracks.map((track, idx) => {
                const isLiked = likedTracks.some(t => t.id === track.id);
                return `
                    <div class="track-card ${currentIndex >= 0 && currentQueue[currentIndex]?.id === track.id ? 'active' : ''}" onclick="playFromQueue('${containerId}', ${idx})">
                        <div class="track-info">
                            <img src="${track.image}" class="track-img">
                            <div class="track-details">
                                <div class="track-title">${track.title}</div>
                                <div class="track-artist">${track.artist}</div>
                            </div>
                        </div>
                        <div class="track-actions" onclick="event.stopPropagation()">
                            <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${track.id}', '${escapeQuotes(track.title)}', '${escapeQuotes(track.artist)}', '${track.image}')">
                                <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeQuotes(str) {
            return str ? str.replace(/'/g, "\\'") : '';
        }

        function playFromQueue(containerId, index) {
            if (containerId === 'homeList') currentQueue = defaultTracks;
            else if (containerId === 'likesList') currentQueue = likedTracks;
            
            currentIndex = index;
            loadAndPlayTrack(currentQueue[currentIndex]);
        }

        function loadAndPlayTrack(track) {
            if (!player || !track) return;
            
            player.loadVideoById(track.id);

            document.getElementById('miniPlayer').classList.add('active');
            document.getElementById('miniImg').src = track.image;
            document.getElementById('miniTitle').innerText = track.title;
            document.getElementById('miniArtist').innerText = track.artist;

            document.getElementById('fsImg').src = track.image;
            document.getElementById('fsTitle').innerText = track.title;
            document.getElementById('fsArtist').innerText = track.artist;

            updateLikeBtnState(track.id);
        }

        function togglePlay() {
            if (!player || currentIndex === -1) return;
            if (isPlaying) player.pauseVideo();
            else player.playVideo();
        }

        function nextTrack() {
            if (currentQueue.length === 0) return;
            if (isShuffle) {
                currentIndex = Math.floor(Math.random() * currentQueue.length);
            } else {
                currentIndex = (currentIndex + 1) % currentQueue.length;
            }
            loadAndPlayTrack(currentQueue[currentIndex]);
        }

        function prevTrack() {
            if (currentQueue.length === 0) return;
            currentIndex = (currentIndex - 1 + currentQueue.length) % currentQueue.length;
            loadAndPlayTrack(currentQueue[currentIndex]);
        }

        function updateControlsUI(playing) {
            const iconClass = playing ? 'fa-pause' : 'fa-play';
            document.getElementById('miniPlayBtn').className = `fas ${iconClass}`;
            document.getElementById('fsPlayBtn').className = `fas ${iconClass}`;
        }

        function startTimer() {
            stopTimer();
            updateTimer = setInterval(() => {
                if (player && player.getCurrentTime) {
                    const current = player.getCurrentTime() || 0;
                    const total = player.getDuration() || 0;
                    
                    if (total > 0) {
                        const pct = (current / total) * 100;
                        document.getElementById('progressFill').style.width = pct + '%';
                        document.getElementById('currentTime').innerText = formatTime(current);
                        document.getElementById('duration').innerText = formatTime(total);
                    }
                }
            }, 500);
        }

        function stopTimer() {
            if (updateTimer) clearInterval(updateTimer);
        }

        function seekTrack(e) {
            if (!player || !player.getDuration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const clickPos = (e.clientX - rect.left) / rect.width;
            player.seekTo(clickPos * player.getDuration(), true);
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // --- RICERCA INTEGRATA COL SERVER ---
        function handleSearch(e) {
            const query = e.target.value.trim();
            if (e.key === 'Enter' && query.length > 0) {
                fetch(`/api/search?q=${encodeURIComponent(query)}`)
                    .then(res => res.json())
                    .then(data => {
                        const results = data.results || data.tracks || [];
                        currentQueue = results;
                        renderTrackList('searchList', results);
                    })
                    .catch(err => {
                        console.error('Errore nella ricerca:', err);
                        document.getElementById('searchList').innerHTML = 
                            '<p style="color:var(--danger); padding:20px 0;">Errore nella ricerca. Riprova tra poco.</p>';
                    });
            }
        }

        function toggleLike(id, title, artist, image) {
            const idx = likedTracks.findIndex(t => t.id === id);
            if (idx > -1) {
                likedTracks.splice(idx, 1);
            } else {
                likedTracks.push({ id, title, artist, image });
            }
            localStorage.setItem('darksound_likes', JSON.stringify(likedTracks));
            updateLikedCount();
            
            if (document.getElementById('view-likes').classList.contains('active')) {
                renderTrackList('likesList', likedTracks);
            }
            if (currentQueue[currentIndex]?.id === id) {
                updateLikeBtnState(id);
            }
        }

        function toggleLikeCurrent() {
            if (currentIndex >= 0 && currentQueue[currentIndex]) {
                const t = currentQueue[currentIndex];
                toggleLike(t.id, t.title, t.artist, t.image);
            }
        }

        function updateLikeBtnState(id) {
            const isLiked = likedTracks.some(t => t.id === id);
            const btn = document.getElementById('fsLikeBtn');
            btn.className = isLiked ? 'fas fa-heart' : 'far fa-heart';
            btn.style.color = isLiked ? 'var(--danger)' : '#fff';
        }

        function updateLikedCount() {
            document.getElementById('likedCount').innerText = likedTracks.length;
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffleBtn').style.color = isShuffle ? 'var(--accent)' : 'var(--text-sub)';
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById('repeatBtn').style.color = isRepeat ? 'var(--accent)' : 'var(--text-sub)';
        }

        function openFullscreen() { document.getElementById('fsPlayer').classList.add('active'); }
        function closeFullscreen() { document.getElementById('fsPlayer').classList.remove('active'); }
        function toggleDrawer() { document.getElementById('profileDrawer').classList.toggle('active'); }
    </script>
</body>
</html>
