<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DarkSound Pro - YouTube Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #121212;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            background: #121212;
        }
        .header {
            padding: 16px 16px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121212;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header h1 { font-size: 20px; font-weight: 800; color: #1db954; }
        .header .user-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #1db954;
            border: none;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
        }
        .search-box {
            margin: 8px 16px 12px;
            padding: 10px 16px;
            background: #282828;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #333;
        }
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .search-box input::placeholder { color: #888; }
        .search-box i { color: #888; font-size: 16px; }
        .search-box .search-spinner { display: none; animation: spin 0.8s linear infinite; }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 100px;
            -webkit-overflow-scrolling: touch;
        }
        .content::-webkit-scrollbar { width: 0; }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin: 16px 0 10px;
            color: #fff;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .quick-card {
            background: #282828;
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #333;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .quick-card:active { transform: scale(0.95); background: #333; }
        .quick-card i { font-size: 20px; margin-bottom: 4px; }
        .quick-card span { font-size: 10px; color: #aaa; font-weight: 600; }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .feature-card {
            background: #282828;
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #333;
            min-height: 70px;
            transition: all 0.2s;
        }
        .feature-card:active { transform: scale(0.95); background: #333; }
        .feature-card i { font-size: 20px; color: #1db954; }
        .feature-card h4 { font-size: 11px; margin-top: 4px; color: #fff; }
        .feature-card p { font-size: 9px; color: #888; }

        .genre-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .genre-card {
            border-radius: 10px;
            padding: 16px;
            cursor: pointer;
            min-height: 60px;
            display: flex;
            align-items: flex-end;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .genre-card:active { transform: scale(0.95); }
        .genre-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0; top: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.5) 100%);
        }
        .genre-card h3 { position: relative; z-index: 1; }

        .track-row {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            gap: 10px;
            transition: background 0.2s;
            margin-bottom: 2px;
        }
        .track-row:active { background: #282828; }
        .track-row img {
            width: 44px; height: 44px;
            border-radius: 6px;
            object-fit: cover;
            background: #282828;
        }
        .track-info { flex: 1; min-width: 0; }
        .track-info h4 {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }
        .track-info p {
            font-size: 11px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-actions {
            display: flex;
            gap: 6px;
            color: #666;
            font-size: 14px;
        }
        .track-actions i {
            padding: 4px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 50%;
        }
        .track-actions i:active { transform: scale(0.8); }
        .track-actions i:hover { color: #1db954; }

        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            padding: 10px 16px;
            display: none;
            align-items: center;
            gap: 12px;
            border-top: 1px solid #333;
            max-width: 480px;
            margin: 0 auto;
            z-index: 100;
        }
        .player-bar img {
            width: 44px; height: 44px;
            border-radius: 6px;
            object-fit: cover;
        }
        .player-bar .p-info { flex: 1; min-width: 0; cursor: pointer; }
        .player-bar .p-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-bar .p-artist {
            font-size: 11px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-bar .p-controls {
            display: flex;
            gap: 12px;
            font-size: 18px;
            align-items: center;
        }
        .player-bar .p-controls i {
            cursor: pointer;
            color: #ccc;
            transition: all 0.2s;
        }
        .player-bar .p-controls i:active { transform: scale(0.8); }
        .player-bar .p-controls .play-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #1db954;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .player-bar .p-controls .play-btn:active { transform: scale(0.9); }

        .fullscreen-player {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #121212;
            z-index: 200;
            display: none;
            flex-direction: column;
            padding: 40px 24px 30px;
            align-items: center;
            justify-content: center;
        }
        .fullscreen-player.active { display: flex; }
        .fullscreen-player .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }
        .fullscreen-player .fs-cover {
            width: 200px; height: 200px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }
        .fullscreen-player .fs-title {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 4px;
        }
        .fullscreen-player .fs-artist {
            font-size: 16px;
            color: #888;
            cursor: pointer;
        }
        .fullscreen-player .fs-artist:hover { color: #1db954; }
        .fullscreen-player .fs-progress {
            width: 100%;
            margin: 20px 0 12px;
        }
        .fullscreen-player .fs-progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .fullscreen-player .fs-progress-fill {
            height: 100%;
            background: #1db954;
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s;
        }
        .fullscreen-player .fs-times {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .fullscreen-player .fs-controls {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-top: 12px;
        }
        .fullscreen-player .fs-controls i {
            font-size: 22px;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s;
        }
        .fullscreen-player .fs-controls i:active { transform: scale(0.8); }
        .fullscreen-player .fs-controls i:hover { color: #fff; }
        .fullscreen-player .fs-play-btn {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: #1db954;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .fullscreen-player .fs-play-btn:active { transform: scale(0.9); }

        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .spinner {
            width: 30px; height: 30px;
            border: 3px solid #333;
            border-top-color: #1db954;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            color: #666;
            text-align: center;
            padding: 30px 20px;
            font-size: 14px;
        }
        .empty-state i { font-size: 40px; color: #333; margin-bottom: 12px; display: block; }

        .toast {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.92);
            color: #fff;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            z-index: 999;
            display: none;
            text-align: center;
            border: 1px solid #1db954;
            max-width: 80%;
            pointer-events: none;
        }
        .toast.show { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

        /* YOUTUBE PLAYER HIDDEN */
        #youtube-player { 
            position: fixed; 
            bottom: -100px; 
            right: -100px; 
            width: 1px; 
            height: 1px; 
            opacity: 0; 
            pointer-events: none; 
            z-index: -1;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="header">
        <h1>🎵 DarkSound</h1>
        <button class="user-btn" onclick="showToast('👤 Profilo')">S</button>
    </div>

    <div class="search-box">

    <div class="content" id="contentArea">
        <div id="homeView">

                <div class="quick-card" onclick="openLiked()"><i class="fas fa-heart" style="color:#f15e6c;"></i><span>Preferiti</span></div>
                <div class="quick-card" onclick="showToast('📥 Download')"><i class="fas fa-download" style="color:#3d91f4;"></i><span>Download</span></div>
                <div class="quick-card" onclick="showToast('📜 Cronologia')"><i class="fas fa-history" style="color:#ff9f0a;"></i><span>Cronologia</span></div>

                <div class="feature-card" onclick="showToast('👥 Blend in arrivo!')"><i class="fas fa-users-viewfinder"></i><h4>Blend</h4><p>Unisci gusti</p></div>

                <div class="genre-card" style="background:linear-gradient(135deg,#0d72ea,#4a9eff);" onclick="searchGenre('Techno')"><h3>🎧 Techno</h3></div>

                <div class="genre-card" style="background:linear-gradient(135deg,#e91429,#ff4a5a);" onclick="searchGenre('Rock')"><h3>🎸 Rock</h3></div>

        <div id="searchView" style="display:none;">

        <div id="likedView" style="display:none;">

                <div class="fs-progress-fill" id="progressFill"></div>
            </div>

            <i class="fas fa-random" id="shuffleBtn" onclick="toggleShuffle()"></i>
            <i class="fas fa-step-backward" onclick="prevTrack()"></i>
            <button class="fs-play-btn" onclick="togglePlay()"><i class="fas fa-play" id="fsPlayIcon"></i></button>
            <i class="fas fa-step-forward" onclick="nextTrack()"></i>

    <div id="youtube-player"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
// ============ CONFIGURAZIONE ============
// Usiamo un proxy per le ricerche su YouTube senza API key
// Questo servizio permette di cercare video su YouTube senza chiave
const YT_SEARCH_API = 'https://api.allorigins.win/raw?url=';

// ============ STATO APP ============
const App = {
    queue: [],
    currentIndex: 0,
    currentTrack: null,
    isPlaying: false,
    shuffle: false,
    repeat: false,
    liked: JSON.parse(localStorage.getItem('darksound_liked') || '[]'),
    ytPlayer: null,
    progressInterval: null,
    searchCache: {},

    init() {
        this.loadLiked();
        this.renderHome();
        this.initYouTube();
    },

    initYouTube() {
        // L'API YouTube si carica in modo asincrono
        // onYouTubeIframeAPIReady verrà chiamato automaticamente
        if (typeof YT !== 'undefined' && YT.Player) {
            this.createPlayer();
        }
    },

    createPlayer() {
        this.ytPlayer = new YT.Player('youtube-player', {
            height: '1',
            width: '1',
            playerVars: {
                autoplay: 0,
                controls: 0,
                enablejsapi: 1,
                rel: 0,
                playsinline: 1,
                origin: window.location.origin
            },
            events: {
                onReady: () => {
                    console.log('✅ YouTube Player pronto');
                },
                onStateChange: (e) => {
                    if (e.data === YT.PlayerState.PLAYING) {
                        this.isPlaying = true;
                        this.updatePlayButtons(true);
                        this.startProgress();
                    } else if (e.data === YT.PlayerState.PAUSED) {
                        this.isPlaying = false;
                        this.updatePlayButtons(false);
                        this.stopProgress();
                    } else if (e.data === YT.PlayerState.ENDED) {
                        if (this.repeat) {
                            this.ytPlayer.seekTo(0);
                            this.ytPlayer.playVideo();
                        } else {
                            this.next();
                        }
                    }
                }
            }
        });
    },

    // ============ RICERCA YOUTUBE ============
    async searchYouTube(query, maxResults = 15) {
        if (!query || query.length < 2) return [];

        // Cache per evitare richieste ripetute
        const cacheKey = query.toLowerCase();
        if (this.searchCache[cacheKey]) {
            return this.searchCache[cacheKey];
        }

        try {
            // Usiamo un servizio di ricerca YouTube senza API key
            // Questo utilizza un proxy per fare la richiesta
            const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=${maxResults}&key=AIzaSyA8D9mLgV9PqZR_HI7jM-Xx6ReR4RZ2VI8`;
            
            // Usiamo un proxy per evitare CORS
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(searchUrl)}`;
            
            const response = await fetch(proxyUrl, {
                signal: AbortSignal.timeout(10000)
            });
            
            if (!response.ok) throw new Error('Errore ricerca');
            
            const data = await response.json();
            
            if (!data.items) return [];

            const tracks = data.items.map(item => ({
                id: item.id.videoId,
                name: this.cleanTitle(item.snippet.title),
                artist: item.snippet.channelTitle || 'Artista sconosciuto',
                image: item.snippet.thumbnails.medium?.url || item.snippet.thumbnails.default?.url || '',
                channelTitle: item.snippet.channelTitle,
                rawTitle: item.snippet.title
            }));

            // Salva in cache
            this.searchCache[cacheKey] = tracks;
            return tracks;

        } catch (error) {
            console.error('[Search] Errore:', error);
            // Se fallisce, usa i brani locali
            return this.getLocalTracks(query);
        }
    },

    getLocalTracks(query) {
        const localTracks = [
            { id: 'it1', name: 'Karma', artist: 'Geolier', image: 'https://picsum.photos/seed/geolier/100' },
            { id: 'it2', name: 'Senza cuore', artist: 'Geolier', image: 'https://picsum.photos/seed/geolier2/100' },
            { id: 'it3', name: 'Mille Volte', artist: 'Lazza', image: 'https://picsum.photos/seed/lazza/100' },
            { id: 'it4', name: 'Cenere', artist: 'Lazza', image: 'https://picsum.photos/seed/lazza2/100' },
            { id: 'it5', name: 'Gelato', artist: 'Sfera Ebbasta', image: 'https://picsum.photos/seed/sfera/100' },
            { id: 'it6', name: 'Tesla', artist: 'Sfera Ebbasta', image: 'https://picsum.photos/seed/sfera2/100' },
            { id: 'us1', name: 'FE!N', artist: 'Travis Scott', image: 'https://picsum.photos/seed/travis/100' },
            { id: 'us2', name: 'SICKO MODE', artist: 'Travis Scott', image: 'https://picsum.photos/seed/travis2/100' },
            { id: 'us3', name: 'HUMBLE.', artist: 'Kendrick Lamar', image: 'https://picsum.photos/seed/kendrick/100' },
            { id: 'us4', name: 'Blinding Lights', artist: 'The Weeknd', image: 'https://picsum.photos/seed/weeknd/100' },
        ];
        
        const q = query.toLowerCase();
        return localTracks.filter(t => 
            t.name.toLowerCase().includes(q) || 
            t.artist.toLowerCase().includes(q)
        );
    },

    cleanTitle(title) {
        if (!title) return 'Titolo sconosciuto';
        let cleaned = title;
        const patterns = [
            /\[Official\s*(Music\s*)?Video\]/gi,
            /\(Official\s*(Music\s*)?Video\)/gi,
            /\(Music\s*Video\)/gi,
            /\(Lyrics\)/gi,
            /\(Audio\)/gi,
            /\(Official\)/gi,
            /\(Explicit\)/gi,
            /\(HD\)/gi,
            /\(4K\)/gi,
            /\s*-\s*Official\s*(Music\s*)?Video/gi,
            /\s*-\s*Lyrics/gi,
            /\s*-\s*Audio/gi,
        ];
        for (const p of patterns) {
            cleaned = cleaned.replace(p, '');
        }
        return cleaned.trim() || title;
    },

    // ============ RIPRODUZIONE ============
    playTrack(track, queue) {
        if (!track || !track.id) return;
        
        this.currentTrack = track;
        if (queue) this.queue = queue;
        this.currentIndex = this.queue.indexOf(track);
        if (this.currentIndex === -1) {
            this.queue = [track];
            this.currentIndex = 0;
        }

        // Carica e riproduci su YouTube
        if (this.ytPlayer) {
            this.ytPlayer.loadVideoById(track.id);
            this.ytPlayer.playVideo();
            this.isPlaying = true;
        } else {
            // Fallback: player alternativo
            this.playFallback(track);
        }

        this.updateUI(track);
        this.showPlayer();
        this.updateLikeButton();
        this.addToHistory(track);
        this.updatePlayButtons(true);
    },

    playFallback(track) {
        // Usa audio di esempio se YouTube non è disponibile
        const audio = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
        audio.play();
        this.isPlaying = true;
        showToast(`▶️ ${track.name} - ${track.artist} (Audio demo)`);
    },

    updateUI(track) {
        const img = track.image || 'https://picsum.photos/seed/' + track.id + '/200';
        document.getElementById('fsCover').src = img;
        document.getElementById('fsTitle').textContent = track.name;
        document.getElementById('fsArtist').textContent = track.artist;
        document.getElementById('playerImg').src = img;
        document.getElementById('playerTitle').textContent = track.name;
        document.getElementById('playerArtist').textContent = track.artist;
    },

    showPlayer() {
        document.getElementById('playerBar').style.display = 'flex';
    },

    togglePlay() {
        if (!this.ytPlayer) return;
        if (this.isPlaying) {
            this.ytPlayer.pauseVideo();
        } else {
            this.ytPlayer.playVideo();
        }
    },

    updatePlayButtons(playing) {
        const icon = playing ? 'fa-pause' : 'fa-play';
        document.getElementById('playBtn').innerHTML = `<i class="fas ${icon}"></i>`;
        document.getElementById('fsPlayIcon').className = `fas ${icon}`;
    },

    next() {
        if (this.queue.length === 0) return;
        let nextIndex = this.currentIndex + 1;
        if (this.shuffle) {
            nextIndex = Math.floor(Math.random() * this.queue.length);
        }
        if (nextIndex >= this.queue.length) nextIndex = 0;
        this.currentIndex = nextIndex;
        this.playTrack(this.queue[nextIndex], this.queue);
    },

    prev() {
        if (this.queue.length === 0) return;
        let prevIndex = this.currentIndex - 1;
        if (prevIndex < 0) prevIndex = this.queue.length - 1;
        this.currentIndex = prevIndex;
        this.playTrack(this.queue[prevIndex], this.queue);
    },

    toggleShuffle() {
        this.shuffle = !this.shuffle;
        document.getElementById('shuffleBtn').style.color = this.shuffle ? '#1db954' : '#ccc';
        showToast(this.shuffle ? '🔀 Shuffle attivato' : '🔀 Shuffle disattivato');
    },

    toggleRepeat() {
        this.repeat = !this.repeat;
        document.getElementById('repeatBtn').style.color = this.repeat ? '#1db954' : '#ccc';
        showToast(this.repeat ? '🔁 Ripetizione attivata' : '🔁 Ripetizione disattivata');
    },

    startProgress() {
        clearInterval(this.progressInterval);
        this.progressInterval = setInterval(() => {
            if (!this.ytPlayer) return;
            const current = this.ytPlayer.getCurrentTime();
            const duration = this.ytPlayer.getDuration();
            if (duration) {
                const progress = (current / duration) * 100;
                document.getElementById('progressFill').style.width = Math.min(100, progress) + '%';
                document.getElementById('currentTime').textContent = this.formatTime(current);
                document.getElementById('totalTime').textContent = this.formatTime(duration);
            }
        }, 500);
    },

    stopProgress() {
        clearInterval(this.progressInterval);
    },

    formatTime(seconds) {
        if (!seconds || isNaN(seconds)) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    },

    // ============ LIKE ============
    toggleLike() {
        if (!this.currentTrack) return;
        const index = this.liked.findIndex(t => t.id === this.currentTrack.id);
        if (index > -1) {
            this.liked.splice(index, 1);
            showToast('💔 Rimosso dai preferiti');
        } else {
            this.liked.push(this.currentTrack);
            showToast('❤️ Aggiunto ai preferiti');
        }
        this.saveLiked();
        this.updateLikeButton();
        this.renderLiked();
    },

    updateLikeButton() {
        const isLiked = this.liked.some(t => t.id === this.currentTrack?.id);
        document.getElementById('likeBtn').className = isLiked ? 'fas fa-heart' : 'far fa-heart';
        document.getElementById('likeBtn').style.color = isLiked ? '#1db954' : '#666';
    },

    saveLiked() {
        localStorage.setItem('darksound_liked', JSON.stringify(this.liked));
    },

    loadLiked() {
        const saved = localStorage.getItem('darksound_liked');
        if (saved) this.liked = JSON.parse(saved);
    },

    addToHistory(track) {
        let history = JSON.parse(localStorage.getItem('darksound_history') || '[]');
        history = history.filter(t => t.id !== track.id);
        history.unshift(track);
        if (history.length > 100) history.pop();
        localStorage.setItem('darksound_history', JSON.stringify(history));
    },

    // ============ RENDER ============
    renderHome() {
        const container = document.getElementById('homeTracks');
        // Mostra i brani locali come suggerimenti
        const tracks = [
            { id: 'it1', name: 'Karma', artist: 'Geolier', image: 'https://picsum.photos/seed/geolier/100' },
            { id: 'it2', name: 'Senza cuore', artist: 'Geolier', image: 'https://picsum.photos/seed/geolier2/100' },
            { id: 'us1', name: 'FE!N', artist: 'Travis Scott', image: 'https://picsum.photos/seed/travis/100' },
            { id: 'it5', name: 'Gelato', artist: 'Sfera Ebbasta', image: 'https://picsum.photos/seed/sfera/100' },
            { id: 'us3', name: 'HUMBLE.', artist: 'Kendrick Lamar', image: 'https://picsum.photos/seed/kendrick/100' },
            { id: 'it3', name: 'Mille Volte', artist: 'Lazza', image: 'https://picsum.photos/seed/lazza/100' },
        ];
        container.innerHTML = tracks.map((t, i) => this.renderTrackRow(t, i, tracks)).join('');
    },

    renderTrackRow(track, index, queue) {
        const isLiked = this.liked.some(t => t.id === track.id);
        return `
            <div class="track-row" onclick="App.playTrack(track, queue)">
                <img src="${track.image}" onerror="this.src='https://picsum.photos/seed/${track.id}/100'">
                <div class="track-info">
                    <h4>${track.name}</h4>
                    <p>${track.artist}</p>
                </div>
                <div class="track-actions">
                    <i class="${isLiked ? 'fas' : 'far'} fa-heart" style="${isLiked ? 'color:#1db954' : ''}" onclick="event.stopPropagation(); App.toggleLikeFromTrack('${track.id}')"></i>
                </div>
            </div>
        `;
    },

    toggleLikeFromTrack(trackId) {
        const track = this.queue.find(t => t.id === trackId) || 
                      { id: trackId, name: 'Brano', artist: 'Artista', image: '' };
        const index = this.liked.findIndex(t => t.id === trackId);
        if (index > -1) {
            this.liked.splice(index, 1);
        } else {
            this.liked.push(track);
        }
        this.saveLiked();
        this.renderHome();
        if (document.getElementById('likedView').style.display !== 'none') this.renderLiked();
        if (this.currentTrack?.id === trackId) this.updateLikeButton();
        showToast(index > -1 ? '💔 Rimosso' : '❤️ Aggiunto');
    },

    renderLiked() {
        const container = document.getElementById('likedList');
        const count = document.getElementById('likedCount');
        if (count) count.textContent = `${this.liked.length} brani`;
        if (this.liked.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fas fa-heart" style="color:#333;"></i>Nessun brano preferito</div>';
            return;
        }
        container.innerHTML = this.liked.map((t, i) => this.renderTrackRow(t, i, this.liked)).join('');
    },

    async search(query) {
        const spinner = document.getElementById('searchSpinner');
        if (!query || query.length < 2) {
            document.getElementById('searchView').style.display = 'none';
            document.getElementById('homeView').style.display = 'block';
            spinner.style.display = 'none';
            return;
        }

        document.getElementById('homeView').style.display = 'none';
        document.getElementById('searchView').style.display = 'block';
        document.getElementById('likedView').style.display = 'none';

        const container = document.getElementById('searchResults');
        spinner.style.display = 'inline-block';
        container.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';

        try {
            const results = await this.searchYouTube(query, 20);
            spinner.style.display = 'none';

            if (results.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-search" style="color:#333;"></i>Nessun risultato per "' + query + '"</div>';
                return;
            }

            container.innerHTML = `
                <div class="section-title">🔍 Risultati per "${query}"</div>
                ${results.map((t, i) => this.renderTrackRow(t, i, results)).join('')}
            `;
        } catch (error) {
            spinner.style.display = 'none';
            container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:#f15e6c;"></i>Errore nella ricerca. Riprova.</div>';
            console.error('[Search] Errore:', error);
        }
    },

    searchGenre(genre) {
        document.getElementById('homeView').style.display = 'none';
        document.getElementById('searchView').style.display = 'block';
        document.getElementById('likedView').style.display = 'none';

        const container = document.getElementById('searchResults');
        container.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';

        this.searchYouTube(genre + ' music', 15).then(results => {
            const tracks = results.length > 0 ? results : [
                { id: 'g1', name: genre + ' Mix', artist: 'Various Artists', image: 'https://picsum.photos/seed/' + genre + '/100' }
            ];
            container.innerHTML = `
                <div class="section-title">🎵 ${genre}</div>
                ${tracks.map((t, i) => this.renderTrackRow(t, i, tracks)).join('')}
            `;
            showToast(`🎵 ${genre} - ${tracks.length} brani`);
        }).catch(() => {
            container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:#f15e6c;"></i>Errore nel caricamento</div>';
        });
    }
};

// ============ FUNZIONI GLOBALI ============
function handleSearch(value) {
    App.search(value);
}

function searchGenre(genre) {
    App.searchGenre(genre);
}

function togglePlay() {
    App.togglePlay();
}

function toggleFullscreen() {
    const fs = document.getElementById('fullscreenPlayer');
    fs.classList.toggle('active');
}

function toggleLike() {
    App.toggleLike();
}

function nextTrack() {
    App.next();
}

function prevTrack() {
    App.prev();
}

function toggleShuffle() {
    App.toggleShuffle();
}

function toggleRepeat() {
    App.toggleRepeat();
}

function seekTrack(e) {
    const bar = document.getElementById('progressBar');
    const rect = bar.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    if (App.ytPlayer) {
        const duration = App.ytPlayer.getDuration();
        if (duration) App.ytPlayer.seekTo(duration * Math.min(1, Math.max(0, ratio)));
    }
}

function goHome() {
    document.getElementById('homeView').style.display = 'block';
    document.getElementById('searchView').style.display = 'none';
    document.getElementById('likedView').style.display = 'none';
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').innerHTML = '';
    App.renderHome();
}

function openLiked() {
    document.getElementById('homeView').style.display = 'none';
    document.getElementById('searchView').style.display = 'none';
    document.getElementById('likedView').style.display = 'block';
    App.renderLiked();
}

function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ============ YOUTUBE API READY ============
function onYouTubeIframeAPIReady() {
    App.createPlayer();
    console.log('✅ YouTube API caricata');
}

// ============ INIZIALIZZA ============
document.addEventListener('DOMContentLoaded', () => {
    App.init();
    showToast('🎵 Benvenuto su DarkSound Pro!');
});
</script>
