<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DarkSound Pro - Social & Share Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #000000;
            --text-main: #ffffff;
            --text-sub: #98989f;
            --accent: #30d158;
            --glass-bg: rgba(28, 28, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --transition-smooth: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            padding-bottom: 180px;
            min-height: 100vh;
            font-size: 16px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(48, 48, 80, 0.25) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(80, 30, 60, 0.2) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .view { display: none; padding: 20px; animation: iosFadeIn 0.45s var(--transition-smooth) forwards; }
        .view.active { display: block; }

        @keyframes iosFadeIn {
            from { opacity: 0; transform: scale(0.97) translateY(10px); filter: blur(4px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        .top-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .badge-pro {
            background: rgba(48, 209, 88, 0.15);
            border: 1px solid rgba(48, 209, 88, 0.3);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-status-right { display: flex; gap: 8px; align-items: center; }
        .status-pill {
            background: rgba(46, 189, 89, 0.2);
            color: #30d158;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
        }
        .user-pill {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
        }

        #auth-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(30px);
            z-index: 3000; display: none; justify-content: center; align-items: center; padding: 20px;
        }
        #auth-modal.active { display: flex; }
        .auth-card {
            background: rgba(28, 28, 34, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px; padding: 30px; width: 100%; max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }
        .auth-card h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
        .auth-card p { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 24px; }
        .auth-input-group { margin-bottom: 16px; }
        .auth-input-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-sub); }
        .auth-input-group input, .auth-input-group select {
            width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            padding: 14px; border-radius: 12px; color: white; font-size: 1rem; outline: none;
        }
        .auth-btn {
            width: 100%; background: var(--accent); color: black; font-weight: 800; padding: 14px;
            border-radius: 12px; border: none; font-size: 1rem; cursor: pointer; margin-top: 10px;
        }

        .home-title { font-size: 2rem; font-weight: 800; margin-bottom: 16px; letter-spacing: -0.5px; }
        .section-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }

        .track-row { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 10px 12px; cursor: pointer; border-radius: 12px; margin-bottom: 4px; 
        }
        .track-row:active { background: rgba(255,255,255,0.08); }
        .track-row-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; overflow: hidden; }
        .track-row-left img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: #333; flex-shrink: 0; }
        .track-meta { flex: 1; min-width: 0; overflow: hidden; }
        .track-meta h4 { font-size: 1.05rem; font-weight: 700; color: white; white-space: nowrap; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; }
        .track-meta p { font-size: 0.85rem; color: var(--text-sub); display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge-full { background: rgba(48,209,88,0.2); color: var(--accent); padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; }
        .badge-public { background: rgba(0, 122, 255, 0.2); color: #007aff; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; }
        .badge-private { background: rgba(255, 149, 0, 0.2); color: #ff9500; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; }
        .track-actions { display: flex; align-items: center; gap: 14px; color: var(--text-sub); font-size: 1.2rem; padding: 6px; flex-shrink: 0; }

        .search-box { 
            background: rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 14px 18px; 
            display: flex; align-items: center; gap: 12px; margin-bottom: 24px; border: 1px solid rgba(255,255,255,0.1); 
        }
        .search-box input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 1.05rem; }

        .btn-action-primary {
            background: var(--accent); color: black; font-weight: 700; border: none; 
            padding: 8px 14px; border-radius: 12px; cursor: pointer; font-size: 0.85rem;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
            z-index: 4000; display: none; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: rgba(28, 28, 34, 0.95); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px; padding: 24px; width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto;
        }

        .share-option-btn {
            display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; color: white; font-weight: 700; font-size: 1rem; cursor: pointer; margin-bottom: 10px;
        }
        .share-option-btn i { font-size: 1.3rem; }

        .player-bar {
            position: fixed; bottom: 76px; left: 12px; right: 12px; 
            background: rgba(30, 30, 34, 0.85); backdrop-filter: blur(30px);
            border-radius: 16px; padding: 10px 14px; display: none; align-items: center; gap: 14px; z-index: 1900; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); cursor: pointer;
        }
        .player-bar img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; }
        .player-meta { flex: 1; min-width: 0; }
        .p-title { font-size: 0.95rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-artist { font-size: 0.82rem; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-icons { display: flex; align-items: center; gap: 18px; font-size: 1.3rem; color: #fff; }

        #fullscreen-player {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: linear-gradient(180deg, rgba(40,25,38,0.98) 0%, rgba(10,10,12,0.99) 100%);
            backdrop-filter: blur(40px); z-index: 2500; display: none; flex-direction: column; padding: 40px 24px;
            justify-content: space-between;
        }
        #fullscreen-player.active { display: flex; }
        .fs-top { display: flex; justify-content: space-between; align-items: center; color: white; font-size: 1.35rem; }
        .fs-cover { width: 100%; max-width: 340px; aspect-ratio: 1; border-radius: 20px; object-fit: cover; margin: 20px auto; box-shadow: 0 25px 60px rgba(0,0,0,0.8); }
        .fs-info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .fs-titles { flex: 1; min-width: 0; padding-right: 10px; }
        .fs-titles h3 { font-size: 1.6rem; font-weight: 700; color: white; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fs-titles p { font-size: 1.05rem; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .progress-container { width: 100%; margin-bottom: 24px; }
        .progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; position: relative; cursor: pointer; }
        .progress-bar-fill { width: 0%; height: 100%; background: white; border-radius: 3px; position: relative; }
        .progress-times { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-sub); margin-top: 8px; }

        .fs-controls { display: flex; justify-content: space-between; align-items: center; font-size: 1.6rem; color: white; margin-bottom: 20px; }
        .fs-play-btn { width: 72px; height: 72px; background: white; color: black; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; }

        nav {
            position: fixed; bottom: 12px; left: 16px; right: 16px; height: 64px; 
            background: rgba(20, 20, 24, 0.8); backdrop-filter: blur(30px);
            display: flex; justify-content: space-around; align-items: center; border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.12); z-index: 2000;
        }
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; gap: 3px; 
            color: var(--text-sub); font-size: 0.75rem; font-weight: 600; 
            cursor: pointer; background: none; border: none; padding: 6px 16px; 
        }
        .nav-item.active { color: var(--text-main); }
        #youtube-player { position: fixed; bottom: 0; left: 0; width: 200px; height: 200px; opacity: 0.01; pointer-events: none; z-index: -1000; }
    </style>
</head>
<body>

    <div id="auth-modal">
        <div class="auth-card">
            <h2>Benvenuto</h2>
            <p>Accedi per creare playlist e sincronizzare i brani.</p>
            <div class="auth-input-group">
                <label>Nome Utente</label>
                <input type="text" id="authEmail" placeholder="mario_rossi">
            </div>
            <button class="auth-btn" onclick="handleAuthSubmit()">Accedi</button>
        </div>
    </div>

    <!-- Modale Condivisione Brano -->
    <div id="share-modal" class="modal-overlay">
        <div class="modal-card">
            <h3 style="font-size:1.2rem; font-weight:800; margin-bottom:6px;">Condividi brano</h3>
            <p id="shareTrackSubtitle" style="color:var(--text-sub); font-size:0.9rem; margin-bottom:20px;"></p>
            <button class="share-option-btn" style="color:#25D366;" onclick="shareViaWhatsApp()">
                <i class="fab fa-whatsapp"></i> Invia su WhatsApp
            </button>
            <button class="share-option-btn" onclick="copyTrackLink()">
                <i class="fas fa-link" style="color:#007aff;"></i> Copia Link Brano
            </button>
            <button class="auth-btn" style="background:rgba(255,255,255,0.1); color:white; margin-top:10px;" onclick="closeShareModal()">Chiudi</button>
        </div>
    </div>

    <!-- Modale Selezione Playlist -->
    <div id="playlist-select-modal" class="modal-overlay">
        <div class="modal-card">
            <h3 style="font-size:1.2rem; font-weight:800; margin-bottom:14px;">Aggiungi a playlist</h3>
            <div id="playlistSelectList" style="display:flex; flex-direction:column; gap:8px; margin-bottom:16px;"></div>
            <button class="auth-btn" style="background:rgba(255,255,255,0.1); color:white;" onclick="closePlaylistModal()">Chiudi</button>
        </div>
    </div>

    <!-- Modale Nuova Playlist -->
    <div id="new-playlist-modal" class="modal-overlay">
        <div class="modal-card">
            <h3 style="font-size:1.2rem; font-weight:800; margin-bottom:14px;">Crea Nuova Playlist</h3>
            <div class="auth-input-group">
                <label>Nome Playlist</label>
                <input type="text" id="newPlaylistName" placeholder="Es. I miei preferiti">
            </div>
            <div class="auth-input-group">
                <label>Visibilità</label>
                <select id="newPlaylistVisibility">
                    <option value="private">Privata (Solo tu)</option>
                    <option value="public">Pubblica (Tutti possono cercarla)</option>
                </select>
            </div>
            <button class="auth-btn" onclick="submitNewPlaylist()">Crea</button>
            <button class="auth-btn" style="background:rgba(255,255,255,0.1); color:white; margin-top:8px;" onclick="closeNewPlaylistModal()">Annulla</button>
        </div>
    </div>

    <div id="view-home" class="view active">
        <div class="top-status-bar">
            <div class="badge-pro"><i class="fas fa-circle" style="font-size:0.45rem;"></i> DARKSOUND SOCIAL</div>
            <div class="user-status-right">
                <span class="status-pill" id="syncStatusBadge">Online</span>
                <span class="user-pill" id="userProfilePill" onclick="openAuthModal()">Accedi</span>
            </div>
        </div>
        <h1 class="home-title">Esplora</h1>
        <div class="section-title">Top Hit Nazionali</div>
        <div id="homeTracksContainer"><p style="color:var(--text-sub);">Caricamento...</p></div>
    </div>

    <div id="view-search" class="view">
        <h1 class="home-title">Cerca</h1>
        <div class="search-box">
            <i class="fas fa-search" style="color: var(--text-sub);"></i>
            <input type="text" id="spotifySearchInput" placeholder="Cerca brani o playlist pubbliche..." oninput="handleSearchInput(this.value)">
        </div>
        <div id="searchResultsContainer" style="margin-top:24px;"></div>
    </div>

    <div id="view-library" class="view">
        <div class="section-title">
            La tua Libreria
            <button class="btn-action-primary" onclick="openNewPlaylistModal()"><i class="fas fa-plus"></i> Nuova Playlist</button>
        </div>
        <div style="display: flex; gap: 10px; margin-bottom: 20px; overflow-x:auto;">
            <button class="chip active" id="btnTabLiked" onclick="switchLibraryTab('liked')">Preferiti</button>
            <button class="chip" id="btnTabDownloads" onclick="switchLibraryTab('downloads')">Scaricati</button>
            <button class="chip" id="btnTabPlaylists" onclick="switchLibraryTab('playlists')">Le tue Playlist</button>
        </div>
        <div id="libContentList"><p style="color:var(--text-sub);">Nessun elemento.</p></div>
    </div>

    <div id="fullscreen-player">
        <div class="fs-top">
            <i class="fas fa-chevron-down" onclick="toggleFullscreen()" style="cursor:pointer;"></i>
            <span>IN RIPRODUZIONE</span>
            <i class="fas fa-ellipsis-vertical"></i>
        </div>
        <img id="fsCover" class="fs-cover" src="">
        <div class="fs-info-row">
            <div class="fs-titles">
                <h3 id="fsTitle">-</h3>
                <p id="fsArtist">-</p>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-share-nodes" style="font-size: 1.3rem; color: var(--text-sub); cursor:pointer; padding: 10px;" title="Condividi brano" onclick="openShareModal()"></i>
                <i class="fas fa-folder-plus" style="font-size: 1.3rem; color: var(--text-sub); cursor:pointer; padding: 10px;" title="Aggiungi a playlist" onclick="openPlaylistSelectorForCurrent()"></i>
                <i class="fas fa-download" id="fsDownloadDirectBtn" style="font-size: 1.3rem; color: var(--text-sub); cursor:pointer; padding: 10px;" title="Salva Offline" onclick="toggleDownloadCurrent()"></i>
                <i class="fas fa-heart" id="fsLikeBtn" style="font-size: 1.5rem; color: var(--text-sub); cursor:pointer; padding: 10px;" onclick="toggleLikeCurrent()"></i>
            </div>
        </div>
        <div class="progress-container">
            <div class="progress-bar-bg" id="progressBarBg" onclick="seekTrack(event)">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="progress-times">
                <span id="currentTime">0:00</span>
                <span id="totalDuration">0:00</span>
            </div>
        </div>
        <div class="fs-controls">
            <i class="fas fa-random" style="color:var(--text-sub);"></i>
            <i class="fas fa-step-backward" style="cursor:pointer;" onclick="prevTrack()"></i>
            <div class="fs-play-btn" onclick="togglePlay()"><i class="fas fa-play" id="fsPlayIcon"></i></div>
            <i class="fas fa-step-forward" style="cursor:pointer;" onclick="nextTrack()"></i>
            <i class="fas fa-redo" style="color:var(--text-sub);"></i>
        </div>
    </div>

    <div id="youtube-player"></div>

    <div class="player-bar" id="playerBar" onclick="toggleFullscreen()">
        <img id="playerImg" src="">
        <div class="player-meta">
            <div class="p-title" id="playerTitle">-</div>
            <div class="p-artist" id="playerArtist">-</div>
        </div>
        <div class="player-icons" onclick="event.stopPropagation()">
            <i class="fas fa-heart" id="miniLikeBtn" onclick="toggleLikeCurrent()"></i>
            <i class="fas fa-play" id="playPauseIcon" onclick="togglePlay()"></i>
        </div>
    </div>

    <nav>
        <button class="nav-item active" onclick="switchView('home', this)"><i class="fas fa-home"></i><span>Home</span></button>
        <button class="nav-item" onclick="switchView('search', this)"><i class="fas fa-search"></i><span>Cerca</span></button>
        <button class="nav-item" onclick="switchView('library', this)"><i class="fas fa-bookmark"></i><span>Libreria</span></button>
    </nav>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player, isPlaying = false, playQueue = [], queueIndex = -1;
        let currentTrackData = { id: '', name: '', artist: '', image: '' };
        let currentUser = localStorage.getItem('darksound_current_user') || null;
        let likedSongs = JSON.parse(localStorage.getItem(currentUser ? `liked_${currentUser}` : 'darksound_liked') || '[]');
        let downloadedTracks = JSON.parse(localStorage.getItem(currentUser ? `downloads_${currentUser}` : 'darksound_downloads') || '[]');
        let userPlaylists = JSON.parse(localStorage.getItem(currentUser ? `playlists_${currentUser}` : 'darksound_playlists') || '[]');
        let globalPublicPlaylists = JSON.parse(localStorage.getItem('darksound_global_public_playlists') || '[]');
        let progressInterval, searchTimer = null, currentLibTab = 'liked', selectedTrackForPlaylist = null;

        window.onload = function() {
            updateUserUI();
            loadHomeTracks();
            if(!currentUser) setTimeout(() => openAuthModal(), 400);
        };

        function openAuthModal() { document.getElementById('auth-modal').classList.add('active'); }
        function closeAuthModal() { document.getElementById('auth-modal').classList.remove('active'); }

        function handleAuthSubmit() {
            const name = document.getElementById('authEmail').value.trim();
            if(!name) return alert('Inserisci un nome utente.');
            currentUser = name;
            localStorage.setItem('darksound_current_user', currentUser);
            likedSongs = JSON.parse(localStorage.getItem(`liked_${currentUser}`) || '[]');
            downloadedTracks = JSON.parse(localStorage.getItem(`downloads_${currentUser}`) || '[]');
            userPlaylists = JSON.parse(localStorage.getItem(`playlists_${currentUser}`) || '[]');
            updateUserUI();
            closeAuthModal();
            loadHomeTracks();
        }

        function updateUserUI() {
            document.getElementById('userProfilePill').innerText = currentUser ? currentUser : 'Accedi';
        }

        function saveUserData() {
            if(currentUser) {
                localStorage.setItem(`liked_${currentUser}`, JSON.stringify(likedSongs));
                localStorage.setItem(`downloads_${currentUser}`, JSON.stringify(downloadedTracks));
                localStorage.setItem(`playlists_${currentUser}`, JSON.stringify(userPlaylists));
                syncGlobalPublicPlaylists();
            }
        }

        function syncGlobalPublicPlaylists() {
            let others = globalPublicPlaylists.filter(p => p.owner !== currentUser);
            let minePublic = userPlaylists.filter(p => p.visibility === 'public').map(p => ({...p, owner: currentUser}));
            globalPublicPlaylists = [...others, ...minePublic];
            localStorage.setItem('darksound_global_public_playlists', JSON.stringify(globalPublicPlaylists));
        }

        async function loadHomeTracks() {
            try {
                let res = await fetch('/api/search?q=Hit Italia');
                let tracks = await res.json();
                playQueue = tracks;
                renderTracksList(tracks, 'homeTracksContainer');
            } catch(e) {
                document.getElementById('homeTracksContainer').innerHTML = `<p style="color:#ff4d4d;">Errore di caricamento.</p>`;
            }
        }

        function handleSearchInput(val) {
            clearTimeout(searchTimer);
            if(val.trim().length < 2) {
                document.getElementById('searchResultsContainer').innerHTML = '';
                return;
            }
            searchTimer = setTimeout(() => executeSearch(val), 250);
        }

        async function executeSearch(query) {
            try {
                let res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                let tracks = await res.json();
                let matchedPlaylists = globalPublicPlaylists.filter(p => p.name.toLowerCase().includes(query.toLowerCase()));

                let container = document.getElementById('searchResultsContainer');
                let html = '';

                if(matchedPlaylists.length > 0) {
                    html += `<div class="section-title">Playlist Pubbliche</div>`;
                    html += matchedPlaylists.map(pl => `
                        <div class="track-row" onclick="openPublicPlaylist('${pl.id}')">
                            <div class="track-row-left">
                                <div style="width:52px;height:52px;background:linear-gradient(135deg,#007aff,#5856d6);border-radius:10px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-list" style="color:white;"></i></div>
                                <div class="track-meta">
                                    <h4>${pl.name}</h4>
                                    <p><span class="badge-public">PUBBLICA</span> Di ${pl.owner} • ${pl.tracks.length} brani</p>
                                </div>
                            </div>
                            <div class="track-actions" onclick="event.stopPropagation()">
                                <button class="btn-action-primary" onclick="savePublicPlaylistToLibrary('${pl.id}')">Salva</button>
                            </div>
                        </div>
                    `).join('');
                }

                html += `<div class="section-title" style="margin-top:20px;">Brani Musicali</div>`;
                container.innerHTML = html;
                
                playQueue = tracks;
                container.innerHTML += tracks.map((t, idx) => renderSingleTrackRow(t, idx)).join('');
            } catch(e) {}
        }

        function renderSingleTrackRow(t, idx) {
            const isLiked = likedSongs.some(s => s.id === t.id);
            const isDownloaded = downloadedTracks.some(s => s.id === t.id);
            return `
                <div class="track-row" onclick="playQueueIndex(${idx})">
                    <div class="track-row-left">
                        <img src="${t.image}" onerror="this.src='https://picsum.photos/seed/${idx}/200'">
                        <div class="track-meta">
                            <h4>${t.name}</h4>
                            <p><span class="badge-full">AUDIO</span> ${t.artist}</p>
                        </div>
                    </div>
                    <div class="track-actions" onclick="event.stopPropagation()">
                        <i class="fas fa-folder-plus" title="Aggiungi a playlist" onclick="openPlaylistSelectorForTrack(${idx})"></i>
                        <i class="fas fa-download ${isDownloaded ? 'saved' : ''}" onclick="toggleDownloadTrack(${idx})"></i>
                        <i class="${isLiked ? 'fas fa-heart' : 'far fa-heart'}" style="${isLiked ? 'color:var(--accent);' : ''}" onclick="toggleLikeTrack(${idx})"></i>
                    </div>
                </div>
            `;
        }

        function renderTracksList(tracks, containerId) {
            if(!tracks || tracks.length === 0) {
                document.getElementById(containerId).innerHTML = `<p style="color:var(--text-sub);">Nessun elemento.</p>`;
                return;
            }
            document.getElementById(containerId).innerHTML = tracks.map((t, idx) => renderSingleTrackRow(t, idx)).join('');
        }

        // Condivisione WhatsApp & Link
        function openShareModal() {
            if(!currentTrackData.id) return;
            document.getElementById('shareTrackSubtitle').innerText = `${currentTrackData.name} - ${currentTrackData.artist}`;
            document.getElementById('share-modal').classList.add('active');
        }
        function closeShareModal() { document.getElementById('share-modal').classList.remove('active'); }

        function copyTrackLink() {
            const shareText = `Ascolta "${currentTrackData.name}" di ${currentTrackData.artist} su DarkSound Pro! https://www.youtube.com/watch?v=${currentTrackData.id}`;
            navigator.clipboard.writeText(shareText).then(() => {
                alert('Link copiato negli appunti!');
                closeShareModal();
            });
        }

        function shareViaWhatsApp() {
            const shareText = encodeURIComponent(`Ascolta "${currentTrackData.name}" di ${currentTrackData.artist} su DarkSound Pro! https://www.youtube.com/watch?v=${currentTrackData.id}`);
            window.open(`https://api.whatsapp.com/send?text=${shareText}`, '_blank');
            closeShareModal();
        }

        // Gestione Playlist Utente
        function openNewPlaylistModal() {
            if(!currentUser) return openAuthModal();
            document.getElementById('new-playlist-modal').classList.add('active');
        }
        function closeNewPlaylistModal() { document.getElementById('new-playlist-modal').classList.remove('active'); }

        function submitNewPlaylist() {
            const name = document.getElementById('newPlaylistName').value.trim();
            const visibility = document.getElementById('newPlaylistVisibility').value;
            if(!name) return alert('Inserisci un nome.');

            userPlaylists.push({
                id: 'pl_' + Date.now(),
                name: name,
                visibility: visibility,
                owner: currentUser,
                tracks: []
            });
            saveUserData();
            closeNewPlaylistModal();
            document.getElementById('newPlaylistName').value = '';
            if(currentLibTab === 'playlists') renderLibraryContent();
        }

        function openPlaylistSelectorForCurrent() {
            selectedTrackForPlaylist = currentTrackData;
            showPlaylistSelectorModal();
        }

        function openPlaylistSelectorForTrack(idx) {
            selectedTrackForPlaylist = playQueue[idx];
            showPlaylistSelectorModal();
        }

        function showPlaylistSelectorModal() {
            if(!currentUser) return openAuthModal();
            const listEl = document.getElementById('playlistSelectList');
            if(userPlaylists.length === 0) {
                listEl.innerHTML = `<p style="color:var(--text-sub);">Nessuna playlist creata.</p>`;
            } else {
                listEl.innerHTML = userPlaylists.map(pl => `
                    <div class="track-row" style="background:rgba(255,255,255,0.05); margin-bottom:6px;" onclick="addTrackToPlaylist('${pl.id}')">
                        <div class="track-meta">
                            <h4>${pl.name}</h4>
                            <p>${pl.visibility === 'public' ? 'Pubblica' : 'Privata'} • ${pl.tracks.length} brani</p>
                        </div>
                        <i class="fas fa-plus" style="color:var(--accent);"></i>
                    </div>
                `).join('');
            }
            document.getElementById('playlist-select-modal').classList.add('active');
        }

        function closePlaylistModal() { document.getElementById('playlist-select-modal').classList.remove('active'); }

        function addTrackToPlaylist(playlistId) {
            let pl = userPlaylists.find(p => p.id === playlistId);
            if(pl && selectedTrackForPlaylist) {
                if(!pl.tracks.some(t => t.id === selectedTrackForPlaylist.id)) {
                    pl.tracks.push(selectedTrackForPlaylist);
                    saveUserData();
                    alert(`Brano aggiunto a "${pl.name}"!`);
                } else {
                    alert('Brano già presente nella playlist.');
                }
            }
            closePlaylistModal();
        }

        function switchLibraryTab(tab) {
            currentLibTab = tab;
            document.getElementById('btnTabLiked').className = tab === 'liked' ? 'chip active' : 'chip';
            document.getElementById('btnTabDownloads').className = tab === 'downloads' ? 'chip active' : 'chip';
            document.getElementById('btnTabPlaylists').className = tab === 'playlists' ? 'chip active' : 'chip';
            renderLibraryContent();
        }

        function renderLibraryContent() {
            const container = document.getElementById('libContentList');
            if(currentLibTab === 'liked') {
                renderTracksList(likedSongs, 'libContentList');
            } else if(currentLibTab === 'downloads') {
                renderTracksList(downloadedTracks, 'libContentList');
            } else if(currentLibTab === 'playlists') {
                if(userPlaylists.length === 0) {
                    container.innerHTML = `<p style="color:var(--text-sub); margin-top:20px;">Nessuna playlist.</p>`;
                    return;
                }
                container.innerHTML = userPlaylists.map(pl => `
                    <div class="track-row" onclick="openUserPlaylistDetails('${pl.id}')">
                        <div class="track-row-left">
                            <div style="width:52px;height:52px;background:linear-gradient(135deg,#30d158,#007aff);border-radius:10px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-list" style="color:black;"></i></div>
                            <div class="track-meta">
                                <h4>${pl.name}</h4>
                                <p><span class="${pl.visibility === 'public' ? 'badge-public' : 'badge-private'}">${pl.visibility === 'public' ? 'PUBBLICA' : 'PRIVATA'}</span> ${pl.tracks.length} brani</p>
                            </div>
                        </div>
                        <div class="track-actions" onclick="event.stopPropagation()">
                            <i class="fas fa-trash" style="color:#ff4d4d; font-size:1rem;" onclick="deleteUserPlaylist('${pl.id}')"></i>
                        </div>
                    </div>
                `).join('');
            }
        }

        function openUserPlaylistDetails(playlistId) {
            let pl = userPlaylists.find(p => p.id === playlistId);
            if(!pl) return;
            playQueue = pl.tracks;
            const container = document.getElementById('libContentList');
            container.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                    <button class="chip" onclick="renderLibraryContent()"><i class="fas fa-arrow-left"></i> Indietro</button>
                    <h3 style="font-size:1.1rem; font-weight:800;">${pl.name}</h3>
                </div>
            `;
            container.innerHTML += pl.tracks.map((t, idx) => renderSingleTrackRow(t, idx)).join('');
        }

        function openPublicPlaylist(playlistId) {
            let pl = globalPublicPlaylists.find(p => p.id === playlistId);
            if(!pl) return;
            playQueue = pl.tracks;
            switchView('search', document.querySelectorAll('.nav-item')[1]);
            const container = document.getElementById('searchResultsContainer');
            container.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                    <button class="chip" onclick="document.getElementById('searchResultsContainer').innerHTML=''"><i class="fas fa-arrow-left"></i> Indietro</button>
                    <h3 style="font-size:1.1rem; font-weight:800;">${pl.name} (di ${pl.owner})</h3>
                </div>
            `;
            container.innerHTML += pl.tracks.map((t, idx) => renderSingleTrackRow(t, idx)).join('');
        }

        function savePublicPlaylistToLibrary(playlistId) {
            let pl = globalPublicPlaylists.find(p => p.id === playlistId);
            if(pl) {
                userPlaylists.push({...pl, id: 'pl_saved_' + Date.now(), owner: currentUser + ' (Salvata)'});
                saveUserData();
                alert(`Playlist "${pl.name}" aggiunta alla tua libreria!`);
            }
        }

        function deleteUserPlaylist(playlistId) {
            userPlaylists = userPlaylists.filter(p => p.id !== playlistId);
            saveUserData();
            renderLibraryContent();
        }

        function toggleDownloadTrack(idx) {
            const t = playQueue[idx];
            if(!t) return;
            const exists = downloadedTracks.findIndex(s => s.id === t.id);
            if(exists > -1) downloadedTracks.splice(exists, 1);
            else downloadedTracks.push(t);
            saveUserData();
            renderTracksList(playQueue, 'libContentList');
        }

        function toggleDownloadCurrent() {
            if(!currentTrackData.id) return;
            const exists = downloadedTracks.findIndex(s => s.id === currentTrackData.id);
            if(exists > -1) downloadedTracks.splice(exists, 1);
            else downloadedTracks.push(currentTrackData);
            saveUserData();
            updateDownloadButtonUI();
        }

        function playQueueIndex(index) {
            if(index >= 0 && index < playQueue.length) {
                queueIndex = index;
                const t = playQueue[queueIndex];
                currentTrackData = t;

                document.getElementById('playerBar').style.display = 'flex';
                document.getElementById('playerTitle').innerText = t.name;
                document.getElementById('playerArtist').innerText = t.artist;
                document.getElementById('playerImg').src = t.image;

                document.getElementById('fsTitle').innerText = t.name;
                document.getElementById('fsArtist').innerText = t.artist;
                document.getElementById('fsCover').src = t.image;

                updateLikeButtonUI();
                updateDownloadButtonUI();
                if(player && player.loadVideoById) {
                    player.loadVideoById(t.id);
                    player.playVideo();
                    isPlaying = true;
                    updatePlayIcons(true);
                }
            }
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '200', width: '200',
                playerVars: { 'autoplay': 1, 'controls': 0, 'enablejsapi': 1 },
                events: {
                    'onStateChange': (e) => {
                        if(e.data === YT.PlayerState.PLAYING) { isPlaying = true; updatePlayIcons(true); startProgressTracker(); }
                        if(e.data === YT.PlayerState.PAUSED) { isPlaying = false; updatePlayIcons(false); clearInterval(progressInterval); }
                        if(e.data === YT.PlayerState.ENDED) { nextTrack(); }
                    }
                }
            });
        }

        function togglePlay() {
            if(!player) return;
            if(isPlaying) { player.pauseVideo(); isPlaying = false; } 
            else { player.playVideo(); isPlaying = true; }
            updatePlayIcons(isPlaying);
        }

        function updatePlayIcons(playing) {
            document.getElementById('playPauseIcon').className = playing ? 'fas fa-pause' : 'fas fa-play';
            document.getElementById('fsPlayIcon').className = playing ? 'fas fa-pause' : 'fas fa-play';
        }

        function nextTrack() { if(queueIndex < playQueue.length - 1) playQueueIndex(++queueIndex); }
        function prevTrack() { if(queueIndex > 0) playQueueIndex(--queueIndex); }

        function switchView(viewName, btnElement) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + viewName).classList.add('active');
            if(btnElement) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                btnElement.classList.add('active');
            }
            if(viewName === 'library') renderLibraryContent();
        }

        function toggleFullscreen() { document.getElementById('fullscreen-player').classList.toggle('active'); }

        function toggleLikeCurrent() {
            if(!currentTrackData.id) return;
            const exists = likedSongs.findIndex(s => s.id === currentTrackData.id);
            if(exists > -1) likedSongs.splice(exists, 1);
            else likedSongs.push(currentTrackData);
            saveUserData();
            updateLikeButtonUI();
        }

        function toggleLikeTrack(idx) {
            const t = playQueue[idx];
            if(!t) return;
            const exists = likedSongs.findIndex(s => s.id === t.id);
            if(exists > -1) likedSongs.splice(exists, 1);
            else likedSongs.push(t);
            saveUserData();
        }

        function updateLikeButtonUI() {
            const isLiked = likedSongs.some(s => s.id === currentTrackData.id);
            document.getElementById('fsLikeBtn').style.color = isLiked ? 'var(--accent)' : 'var(--text-sub)';
        }

        function updateDownloadButtonUI() {
            const isDownloaded = downloadedTracks.some(s => s.id === currentTrackData.id);
            document.getElementById('fsDownloadDirectBtn').style.color = isDownloaded ? 'var(--accent)' : 'var(--text-sub)';
        }

        function startProgressTracker() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if(player && player.getCurrentTime && player.getDuration) {
                    let cur = player.getCurrentTime(), dur = player.getDuration();
                    if(dur) {
                        document.getElementById('progressBarFill').style.width = ((cur/dur)*100) + '%';
                        document.getElementById('currentTime').innerText = formatTime(cur);
                        document.getElementById('totalDuration').innerText = formatTime(dur);
                    }
                }
            }, 1000);
        }

        function seekTrack(event) {
            const bg = document.getElementById('progressBarBg');
            const rect = bg.getBoundingClientRect();
            if(player && player.getDuration) player.seekTo(player.getDuration() * ((event.clientX - rect.left) / rect.width), true);
        }

        function formatTime(secs) {
            let m = Math.floor(secs / 60), s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
