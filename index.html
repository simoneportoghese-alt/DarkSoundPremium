<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DarkSound Pro - Liquid Glass Edition</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-glow: rgba(138, 43, 226, 0.4);
      --accent-cyan: #00f2fe;
      --accent-pink: #4facfe;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-card: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-highlight: rgba(255, 255, 255, 0.25);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

    body { background-color: #050508; color: var(--text-main); height: 100vh; width: 100vw; overflow: hidden; display: flex; justify-content: center; }

    /* ORBS & BG */
    .liquid-orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0; animation: float 18s ease-in-out infinite alternate; pointer-events: none; }
    .orb-1 { top: -10%; left: -10%; width: 350px; height: 350px; background: linear-gradient(135deg, #7F00FF, #E100FF); opacity: 0.5; }
    .orb-2 { bottom: -10%; right: -10%; width: 400px; height: 400px; background: linear-gradient(135deg, #00F2FE, #4FACFE); opacity: 0.4; animation-delay: -5s; }
    
    @keyframes float { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(40px, 60px) scale(1.1); } 100% { transform: translate(-30px, 30px) scale(0.9); } }

    #ambient-bg { position: fixed; inset: 0; background-size: cover; background-position: center; filter: blur(100px) brightness(0.3) saturate(2); transform: scale(1.3); z-index: 0; transition: background-image 1.2s ease; }

    /* SHELL & UI */
    .app-shell { position: relative; z-index: 10; width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: rgba(18, 18, 28, 0.45); backdrop-filter: blur(40px); border-left: 1px solid var(--glass-border); border-right: 1px solid var(--glass-border); overflow: hidden; }

    header { padding: 52px 24px 16px; display: flex; justify-content: space-between; align-items: center; }
    .greeting { font-size: 24px; font-weight: 800; background: linear-gradient(to right, #fff, #b3b3b3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    main { flex: 1; overflow-y: auto; padding: 10px 24px 160px; }
    main::-webkit-scrollbar { display: none; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .track-card { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 16px; margin-bottom: 8px; background: var(--glass-card); border: 1px solid var(--glass-border); cursor: pointer; }
    .track-info-group { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
    .track-cover-img { width: 46px; height: 46px; border-radius: 10px; object-fit: cover; }
    .track-title { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track-artist { font-size: 11px; color: var(--text-sub); }

    /* MINI PLAYER */
    #mini-player { position: absolute; bottom: 74px; left: 16px; right: 16px; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); border-radius: 20px; padding: 12px; z-index: 30; border: 1px solid var(--glass-highlight); }
    .progress-bar-container { width: 100%; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; margin-top: 8px; }
    #mini-progress-fill { height: 100%; width: 0%; background: #fff; border-radius: 2px; }

    /* NAV */
    nav { position: absolute; bottom: 0; left: 0; right: 0; height: 68px; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--glass-border); z-index: 40; }
    .nav-item { background: none; border: none; color: var(--text-sub); font-size: 10px; font-weight: 700; cursor: pointer; }
    .nav-item.active { color: #fff; }
  </style>
</head>
<body>

  <div class="liquid-orb orb-1"></div>
  <div class="liquid-orb orb-2"></div>
  <div id="ambient-bg"></div>

  <div class="app-shell">
    <header>
      <h1 class="greeting">DarkSound</h1>
      <div id="auth-btn" class="nav-item" onclick="handleAuth()">Accedi</div>
    </header>

    <main>
      <div id="tab-home" class="tab-content active">
        <div class="section-header" style="color:var(--text-sub); margin-bottom:10px;">Ultimi Ascolti</div>
        <div id="home-playlist-container"></div>
      </div>

      <div id="tab-search" class="tab-content">
        <div class="input-group" style="display:flex; gap:10px;">
          <input type="text" id="import-url" style="flex:1; background:rgba(255,255,255,0.1); border:none; padding:12px; border-radius:12px; color:#fff;" placeholder="Cerca brano..." />
          <button onclick="handleImport()" style="padding:0 20px; border-radius:12px; border:none; cursor:pointer;">Cerca</button>
        </div>
        <div id="search-results-container" style="margin-top:20px;"></div>
      </div>

      <div id="tab-library" class="tab-content">
        <div id="playlist-container"></div>
      </div>
    </main>

    <div id="mini-player">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div class="track-info-group">
          <img id="mini-cover" src="https://via.placeholder.com/100" class="track-cover-img" />
          <div>
            <div id="mini-title" class="track-title">Seleziona un brano</div>
            <div id="mini-artist" class="track-artist">DarkSound</div>
          </div>
        </div>
        <button onclick="togglePlay()" id="mini-play-btn" style="width:40px;height:40px;border-radius:50%;border:none;">▶</button>
      </div>
      <div class="progress-bar-container"><div id="mini-progress-fill"></div></div>
    </div>

    <nav>
      <button class="nav-item active" onclick="switchTab('home', this)">Home</button>
      <button class="nav-item" onclick="switchTab('search', this)">Cerca</button>
      <button class="nav-item" onclick="switchTab('library', this)">Libreria</button>
    </nav>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module">
    // Inserisci qui la tua logica Firebase/Auth se necessario, 
    // altrimenti la logica di ricerca brani funzionerà tramite l'API di iTunes sotto:
  </script>

  <script>
    let player;
    function onYouTubeIframeAPIReady() { player = new YT.Player('yt-player', { height: '0', width: '0', events: {} }); }

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      btn.classList.add('active');
    }

    async function handleImport() {
      const query = document.getElementById('import-url').value;
      const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=10`);
      const data = await res.json();
      const container = document.getElementById('search-results-container');
      container.innerHTML = data.results.map(t => `
        <div class="track-card" onclick="playTrack('${t.trackName}', '${t.artistName}', '${t.artworkUrl100}')">
          <div class="track-info-group">
            <img src="${t.artworkUrl100}" class="track-cover-img" />
            <div>
              <div class="track-title">${t.trackName}</div>
              <div class="track-artist">${t.artistName}</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function playTrack(title, artist, cover) {
      document.getElementById('mini-title').textContent = title;
      document.getElementById('mini-artist').textContent = artist;
      document.getElementById('mini-cover').src = cover;
      document.getElementById('ambient-bg').style.backgroundImage = `url('${cover}')`;
    }

    function togglePlay() { alert("Player attivo!"); }
  </script>
</body>
</html>
