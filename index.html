<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkSound - Liquid Glass Experience</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #030305;
            --glass-surface: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.06);
            --neon-green: #00ff66;
            --neon-glow: 0 0 30px rgba(0, 255, 102, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 255, 102, 0.07) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.05) 0px, transparent 50%);
            color: var(--text-main);
            height: 100vh;
            display: grid;
            grid-template-areas: 
                "sidebar main"
                "player player";
            grid-template-columns: 280px 1fr;
            grid-template-rows: 1fr 100px;
            overflow: hidden;
            padding: 16px;
            gap: 16px;
        }

        /* LIQUID GLASS CONTAINER */
        .liquid-glass {
            background: var(--glass-surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* SIDEBAR */
        aside {
            grid-area: sidebar;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
        }

        .logo i {
            color: var(--neon-green);
            filter: drop-shadow(0 0 10px var(--neon-green));
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border-radius: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item a:hover, .nav-item a.active {
            color: var(--text-main);
            background: var(--glass-hover);
            border: 1px solid var(--glass-border);
        }

        .nav-item a.active i {
            color: var(--neon-green);
        }

        /* MAIN CONTENT AREA */
        main {
            grid-area: main;
            padding: 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-bar {
            position: relative;
            width: 380px;
        }

        .search-bar input {
            width: 100%;
            background: var(--glass-surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 14px 20px 14px 48px;
            border-radius: 500px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar input:focus {
            border-color: var(--neon-green);
            box-shadow: var(--neon-glow);
        }

        .search-bar i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            padding: 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-8px);
            background: var(--glass-hover);
            border-color: rgba(0, 255, 102, 0.4);
            box-shadow: var(--neon-glow);
        }

        .card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 14px;
        }

        .card-info h4 {
            font-size: 1rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .card-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* PLAYER BAR */
        footer {
            grid-area: player;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 30%;
        }

        .now-playing img {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            object-fit: cover;
        }

        .track-details .title {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .track-details .artist {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .player-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 40%;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 24px;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .controls i:hover {
            color: var(--text-main);
            cursor: pointer;
        }

        .controls .fa-play-circle, .controls .fa-pause-circle {
            font-size: 2.4rem;
            color: var(--neon-green);
            filter: drop-shadow(0 0 10px var(--neon-green));
        }

        .progress-area {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            outline: none;
            appearance: none;
            cursor: pointer;
            accent-color: var(--neon-green);
        }

        .volume-area {
            width: 30%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
        }

        .volume-area input {
            width: 100px;
            accent-color: var(--neon-green);
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="liquid-glass">
        <div class="logo">
            <i class="fa-solid fa-compact-disc fa-spin" style="animation-duration: 8s;"></i> DarkSound
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="#" class="active" onclick="loadCategory('electronic')"><i class="fas fa-bolt"></i> Elettronica</a></li>
            <li class="nav-item"><a href="#" onclick="loadCategory('chillout')"><i class="fas fa-moon"></i> Chill & Lofi</a></li>
            <li class="nav-item"><a href="#" onclick="loadCategory('rock')"><i class="fas fa-guitar"></i> Rock & Indie</a></li>
            <li class="nav-item"><a href="#" onclick="loadCategory('pop')"><i class="fas fa-radio"></i> Pop Vibes</a></li>
        </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="liquid-glass" style="border: none; background: transparent; padding: 0;">
        <header>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Cerca brani o artisti..." onkeyup="handleSearch(event)">
            </div>
        </header>

        <section>
            <h2 class="section-title" id="sectionTitle" style="margin-bottom: 24px;">Tracce in primo piano</h2>
            <div class="grid" id="trackGrid">
                <!-- Inserimento dinamico delle card -->
            </div>
        </section>
    </main>

    <!-- PLAYER BAR -->
    <footer class="liquid-glass">
        <div class="now-playing">
            <img id="currentImg" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=150" alt="Cover">
            <div class="track-details">
                <div class="title" id="currentTitle">Seleziona un brano</div>
                <div class="artist" id="currentArtist">DarkSound Player</div>
            </div>
        </div>

        <div class="player-center">
            <div class="controls">
                <i class="fas fa-backward-step" onclick="prevTrack()"></i>
                <i class="fas fa-play-circle" id="playBtn" onclick="togglePlay()"></i>
                <i class="fas fa-forward-step" onclick="nextTrack()"></i>
            </div>
            <div class="progress-area">
                <span id="currentTime">0:00</span>
                <input type="range" class="progress-bar" id="progressBar" value="0" max="100" oninput="seekAudio(this.value)">
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="volume-area">
            <i class="fas fa-volume-high"></i>
            <input type="range" class="progress-bar" min="0" max="1" step="0.01" value="1" oninput="adjustVolume(this.value)">
        </div>
    </footer>

    <!-- SCRIPT LOGICA E API -->
    <script>
        const audio = new Audio();
        let currentTracks = [];
        let currentIndex = 0;
        const CLIENT_ID = '5912443d'; // Jamendo Public ID

        // Funzione per formattare il tempo
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Caricamento tracce da Jamendo API con fallback di sicurezza
        async function loadCategory(query) {
            document.getElementById('sectionTitleinnerText'] = `Esplora: ${query.toUpperCase()}`;
            try {
                let res = await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=${CLIENT_ID}&format=json&limit=16&search=${encodeURIComponent(query)}&audioformat=mp32`);
                let data = await res.json();
                if(data.results && data.results.length > 0) {
                    currentTracks = data.results;
                    renderGrid();
                }
            } catch (err) {
                console.error("Errore di rete con l'API:", err);
            }
        }

        // Gestione ricerca tramite tastiera
        async function handleSearch(e) {
            if (e.key === 'Enter') {
                let query = e.target.value;
                if (!query) return;
                document.getElementById('sectionTitle').innerText = `Risultati per: "${query}"`;
                try {
                    let res = await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=${CLIENT_ID}&format=json&limit=16&search=${encodeURIComponent(query)}&audioformat=mp32`);
                    let data = await res.json();
                    if(data.results) {
                        currentTracks = data.results;
                        renderGrid();
                    }
                } catch(err) {
                    console.error("Errore ricerca:", err);
                }
            }
        }

        // Disegna le card nella griglia
        function renderGrid() {
            const grid = document.getElementById('trackGrid');
            grid.innerHTML = '';
            currentTracks.forEach((track, index) => {
                grid.innerHTML += `
                    <div class="card" onclick="playTrack(${index})">
                        <img src="${track.image}" alt="${track.name}">
                        <div class="card-info">
                            <h4>${track.name}</h4>
                            <p>${track.artist_name}</p>
                        </div>
                    </div>
                `;
            });
        }

        // Riproduzione brano
        function playTrack(index) {
            currentIndex = index;
            const track = currentTracks[currentIndex];
            audio.src = track.audio;
            audio.play();

            document.getElementById('currentImg').src = track.image;
            document.getElementById('currentTitle').innerText = track.name;
            document.getElementById('currentArtist').innerText = track.artist_name;
            document.getElementById('playBtn').className = 'fas fa-pause-circle';
        }

        // Play/Pause toggle
        function togglePlay() {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
                document.getElementById('playBtn').className = 'fas fa-pause-circle';
            } else {
                audio.pause();
                document.getElementById('playBtn').className = 'fas fa-play-circle';
            }
        }

        function nextTrack() {
            if (currentTracks.length === 0) return;
            currentIndex = (currentIndex + 1) % currentTracks.length;
            playTrack(currentIndex);
        }

        function prevTrack() {
            if (currentTracks.length === 0) return;
            currentIndex = (currentIndex - 1 + currentTracks.length) % currentTracks.length;
            playTrack(currentIndex);
        }

        // Aggiornamento barra di progresso
        audio.ontimeupdate = () => {
            if (audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progressBar').value = progress;
                document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
                document.getElementById('duration').innerText = formatTime(audio.duration);
            }
        };

        function seekAudio(val) {
            if (audio.duration) {
                audio.currentTime = (val / 100) * audio.duration;
            }
        }

        function adjustVolume(val) {
            audio.volume = val;
        }

        // Avvio automatico iniziale sulla categoria elettronica
        loadCategory('electronic');
    </script>
</body>
</html>
