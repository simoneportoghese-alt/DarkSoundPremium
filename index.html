<style>
    :root {
        --dark-bg: #050505;
        --glass-bg: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.1);
        --accent-green: #1db954;
        --neon-glow: 0 0 20px rgba(29, 185, 84, 0.2);
    }

    body {
        background: radial-gradient(circle at top right, #1a1a1a, var(--dark-bg));
        color: #ffffff;
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-areas: "sidebar main" "player player";
        grid-template-columns: 260px 1fr;
        grid-template-rows: 1fr 100px;
        overflow: hidden;
    }

    /* Effetto Liquid Glass Base */
    .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
    }

    aside {
        grid-area: sidebar;
        margin: 16px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 30px;
    }

    .logo {
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: -1px;
        color: var(--accent-green);
        text-shadow: var(--neon-glow);
    }

    main {
        grid-area: main;
        overflow-y: auto;
        padding: 32px;
        background: transparent;
    }

    .card {
        background: var(--glass-panel);
        border: 1px solid var(--glass-border);
        padding: 20px;
        border-radius: 16px;
        transition: transform 0.3s ease, border 0.3s;
        cursor: pointer;
    }

    .card:hover {
        transform: translateY(-5px);
        border: 1px solid var(--accent-green);
        box-shadow: var(--neon-glow);
    }

    /* Player in stile Glass */
    footer {
        grid-area: player;
        margin: 0 16px 16px 16px;
        padding: 0 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(40px);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
    }

    .progress-bar {
        accent-color: var(--accent-green);
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
    }
</style>
