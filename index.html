<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkSound - Liquid Glass Player</title>
    <!-- FontAwesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark-bg: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-hover: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-green: #1db954;
            --neon-glow: 0 0 25px rgba(29, 185, 84, 0.25);
            --text-main: #ffffff;
            --text-sub: #9e9e9e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #141414, var(--dark-bg));
            color: var(--text-main);
            height: 100vh;
            display: grid;
            grid-template-areas: 
                "sidebar main"
                "player player";
            grid-template-columns: 260px 1fr;
            grid-template-rows: 1fr 100px;
            overflow: hidden;
        }

        /* EFFETTO LIQUID GLASS BASE */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
        }

        /* SIDEBAR */
        aside {
            grid-area: sidebar;
            margin: 16px 0 16px 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--accent-green);
            text-shadow: var(--neon-glow);
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .nav-links li a {
            color: var(--text-sub);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
            padding: 8px 12px;
            border-radius: 10px;
        }

        .nav-links li a:hover, .nav-links li a.active {
            color: var(--text-main);
            background: var(--glass-hover);
        }

        /* MAIN CONTENT */
        main {
            grid-area: main;
            overflow-y: auto;
            padding: 24px 32px;
            background: transparent;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .search-box {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 10px 18px;
            border-radius: 500px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 320px;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--accent-green);
            box-shadow: var(--neon-glow);
        }

        .search-box input {
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            width: 100%;
            font-size: 0.9rem;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding-bottom: 20px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 16px;
            border-radius: 16px;
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card:hover {
            transform: translateY(-6px);
            background: var(--glass-hover);
            border-color: var(--accent-green);
            box-shadow: var(--neon-glow);
        }

        .card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-artist {
            color: var(--text-sub);
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* PLAYER BAR (LIQUID GLASS) */
        footer {
            grid-area: player;
            margin: 0 16px 16px 16px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 30%;
        }

        .now-playing img {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
        }

        .track-info .title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .track-info .artist {
            font-size: 0.75rem;
            color: var(--text-sub);
            white-space: nowrap;
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 40%;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 1.1rem;
            color: var(--text-sub);
        }

        .control-buttons i {
            transition: color 0.2s;
        }

        .control-buttons i:hover {
            color: var(--text-main);
            cursor: pointer;
        }

        .control-buttons .fa-play-circle, .control-buttons .fa-pause-circle {
            font-size: 2.2rem;
            color: var(--accent-green);
            text-shadow: var(--neon-glow);
        }

        .progress-bar-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            font-size: 0.7rem;
            color: var(--text-sub);
        }

        .progress-bar {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            outline: none;
            appearance: none;
            cursor: pointer;
            accent-color: var(--accent-green);
        }

        .extra-controls {
            width: 30%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            color: var(--text-sub);
        }

        .extra-controls input[type="range"] {
            width: 90px;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="glass-panel">
        <div class="logo">
            <i class="fa-solid fa-wave-square"></i> DarkSound
        </div>
        <ul class="nav-links">
            <li><a href="#" class="active"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="#" onclick="searchTracks('electronic')"><i class="fas fa-bolt"></i> Elettronica</a></li>
            <li><a href="#" onclick="searchTracks('chillout')"><i class="fas fa-moon"></i> Chill & Lofi</a></li>
            <li><a href="#" onclick="searchTracks('rock')"><i class="fas fa-guitar"></i> Rock Sound</a></li>
        </ul>
    </aside>

    <!-- MAIN -->
    <main>
        <header>
            <div class="search-box">
                <i class="fas fa-search" style="color: var(--text-sub);"></i>
                <input type="text" id="searchInput" placeholder="Cerca brani o artisti..." onkeypress="handleSearch(event)">
            </div>
        </header>

        <section>
            <h2 id="sectionTitle">Brani in evidenza</h2>
            <div class="grid-container" id="trackGrid">
                <!-- I brani verranno caricati dinamicamente qui -->
            </div>
        </section>
    </main>

    <!-- PLAYER -->
    <footer>
        <div class="now-playing">
            <img id="currentImage" src="https://via.placeholder.com/50" alt="Cover">
            <div class="track-info">
                <div class="title" id="currentTitle">Nessun brano in riproduzione</div>
                <div class="artist" id="currentArtist">-</div>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <i class="fas fa-step-backward" onclick="prevTrack()"></i>
                <i class="fas fa-play-circle" id="playPauseBtn" onclick="togglePlay()"></i>
                <i class="fas fa-step-forward" onclick="nextTrack()"></i>
            </div>
            <div class="progress-bar-container">
                <span id="currentTime">0:00</span>
                <input type="range" class="progress-bar" id="progressBar" value="0" max="100" oninput="seekAudio(this.value)">
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="extra-controls">
            <i class="fas fa-volume-up"></i>
            <input type="range" class="progress-bar" min="0" max="1" step="0.01" value="1" oninput="adjustVolume(this.value)">
        </div>
    </footer>

    <!-- LOGICA JAVASCRIPT -->
    <script>
        let currentAudio = new Audio();
        let trackList = [];
        let currentIndex = 0;
        const CLIENT_ID = '5912443d'; // Client ID pubblico di Jamendo

        function formatTime(seconds) {
            let minutes = Math.floor(seconds / 60);
            let remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;
        }

        async function searchTracks(query = 'electronic') {
            document.getElementById('sectionTitle').innerText = `Esplora: ${query.charAt(0).toUpperCase() + query.slice(1)}`;
            try {
                let response = await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=${CLIENT_ID}&format=jsonjson&limit=18&search=${encodeURIComponent(query)}&audioformat=mp32`);
                let data = await response.json();
                trackList = data.results;
                renderTracks();
            } catch (error) {
                console.error("Errore nel recupero dei brani:", error);
            }
        }

        function handleSearch(event) {
            if (event.key === 'Enter') {
                let query = document.getElementById('searchInput').value;
                if(query) searchTracks(query);
            }
        }

        function renderTracks() {
            let grid = document.getElementById('trackGrid');
            grid.innerHTML = '';
            
            trackList.forEach((track, index) => {
                let card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => playTrack(index);
                card.innerHTML = `
                    <img src="${track.image}" alt="${track.name}">
                    <div class="card-title">${track.name}</div>
                    <div class="card-artist">${track.artist_name}</div>
                `;
                grid.appendChild(card);
            });
        }

        function playTrack(index) {
            currentIndex = index;
            let track = trackList[currentIndex];

            currentAudio.src = track.audio;
            currentAudio.play();

            document.getElementById('currentImage').src = track.image;
            document.getElementById('currentTitle').innerText = track.name;
            document.getElementById('currentArtist').innerText = track.artist_name;
            document.getElementById('playPauseBtn').className = 'fas fa-pause-circle';
        }

        function togglePlay() {
            if (!currentAudio.src) return;
            if (currentAudio.paused) {
                currentAudio.play();
                document.getElementById('playPauseBtn').className = 'fas fa-pause-circle';
            } else {
                currentAudio.pause();
                document.getElementById('playPauseBtn').className = 'fas fa-play-circle';
            }
        }

        function nextTrack() {
            if (trackList.length === 0) return;
            currentIndex = (currentIndex + 1) % trackList.length;
            playTrack(currentIndex);
        }

        function prevTrack() {
            if (trackList.length === 0) return;
            currentIndex = (currentIndex - 1 + trackList.length) % trackList.length;
            playTrack(currentIndex);
        }

        currentAudio.ontimeupdate = () => {
            if (currentAudio.duration) {
                let progressPercent = (currentAudio.currentTime / currentAudio.duration) * 100;
                document.getElementById('progressBar').value = progressPercent;
                document.getElementById('currentTime').innerText = formatTime(currentAudio.currentTime);
                document.getElementById('duration').innerText = formatTime(currentAudio.duration);
            }
        };

        function seekAudio(value) {
            if (currentAudio.duration) {
                let seekTime = (value / 100) * currentAudio.duration;
                currentAudio.currentTime = seekTime;
            }
        }

        function adjustVolume(value) {
            currentAudio.volume = value;
        }

        // Avvio iniziale
        searchTracks('electronic');
    </script>
</body>
</html>
