<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DarkSound Pro</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --spotify-green: #1DB954;
      --spotify-green-hover: #1ed760;
      --bg-base: #000000;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-hover: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-sub: #a7a7a7;
      --accent-gradient: linear-gradient(135deg, #182848 0%, #4b6cb7 100%);
      --wrapped-gradient: linear-gradient(135deg, #8A2387 0%, #E94057 50%, #F27121 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    /* SFONDO DINAMICO E SFOCATO */
    #ambient-bg {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(70px) brightness(0.25) saturate(1.8);
      transform: scale(1.2);
      z-index: 0;
      transition: background-image 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .app-shell {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 500px; /* Perfetto per Mobile Look & Feel */
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: rgba(10, 10, 10, 0.75);
      backdrop-filter: blur(30px);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    header {
      padding: 48px 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .greeting {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .badge-pro {
      background: rgba(29, 185, 84, 0.15);
      border: 1px solid rgba(29, 185, 84, 0.4);
      color: var(--spotify-green);
      font-size: 11px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 10px 20px 140px;
    }

    /* BANNER CARDS */
    .banner-container {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .card-banner {
      flex: 1;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card-banner:active { transform: scale(0.97); }

    .banner-recap { background: var(--wrapped-gradient); box-shadow: 0 8px 20px rgba(233, 64, 87, 0.3); }
    .banner-import { background: var(--accent-gradient); box-shadow: 0 8px 20px rgba(75, 108, 183, 0.3); }

    .banner-title { font-size: 14px; font-weight: 800; line-height: 1.2; }
    .banner-sub { font-size: 11px; opacity: 0.85; margin-top: 4px; }

    .section-header {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
    }

    /* SEARCH BAR */
    .search-box {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      transition: border 0.2s;
    }
    .search-box:focus-within { border-color: var(--spotify-green); }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      width: 100%;
    }

    /* TRACK LIST ITEM */
    .track-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 6px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      transition: background 0.2s;
      cursor: pointer;
    }
    .track-card:active { background: var(--card-hover); }
    .track-card.playing { border: 1px solid rgba(29, 185, 84, 0.4); background: rgba(29, 185, 84, 0.08); }

    .track-info-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .track-cover-img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      background: #202020;
      flex-shrink: 0;
    }

    .track-details { min-width: 0; flex: 1; }
    .track-title { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 12px; color: var(--text-sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .play-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    /* MINI PLAYER */
    #mini-player {
      position: absolute;
      bottom: 68px;
      left: 12px;
      right: 12px;
      height: 60px;
      background: rgba(30, 30, 30, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 14px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
    }

    .mini-progress {
      position: absolute;
      bottom: 0;
      left: 12px;
      right: 12px;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .mini-progress-fill { height: 100%; width: 0%; background: var(--spotify-green); transition: width 0.2s linear; }

    /* FULLSCREEN PLAYER MODAL */
    #fullscreen-player {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(20, 20, 20, 0.95) 0%, #000000 100%);
      backdrop-filter: blur(40px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 28px 36px;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #fullscreen-player.open { transform: translateY(0); }

    .full-artwork {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      margin: auto 0;
    }

    .play-btn-large {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--spotify-green);
      border: none;
      color: #000;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(29, 185, 84, 0.4);
    }

    /* BOTTOM NAV */
    nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(15px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 30;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .nav-item.active { color: #fff; }

    /* TOAST BANNER */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(40, 40, 40, 0.95);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 200;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
    }
  </style>
</head>
<body>

  <div id="ambient-bg"></div>
  <div id="toast">Notifica</div>
  <audio id="audio-player" playsinline></audio>

  <div class="app-shell">
    <header>
      <div>
        <h1 class="greeting">Buonasera</h1>
      </div>
      <span class="badge-pro">PRO AUDIO</span>
    </header>

    <main>
      <!-- TAB HOME -->
      <section id="tab-home">
        <div class="banner-container">
          <div class="card-banner banner-recap" onclick="showToast('Statistiche in aggiornamento...')">
            <span style="font-size: 20px;">✨</span>
            <div>
              <div class="banner-title">Recap Mese</div>
              <div class="banner-sub">La tua musica</div>
            </div>
          </div>
          <div class="card-banner banner-import" onclick="showToast('Funzione Importa attiva')">
            <span style="font-size: 20px;">📝</span>
            <div>
              <div class="banner-title">Importa</div>
              <div class="banner-sub">Da testo</div>
            </div>
          </div>
        </div>

        <div class="section-header">Brani Consigliati</div>
        <div id="home-songs-list"></div>
      </section>

      <!-- TAB CERCA -->
      <section id="tab-search" style="display: none;">
        <div class="section-header">Cerca</div>
        <div class="search-box">
          <span style="opacity:0.5;">🔍</span>
          <input type="text" placeholder="Cerca artista o brano..." onkeydown="if(event.key==='Enter') searchMusic(this.value)" />
        </div>
        <div id="search-results-list"></div>
      </section>

      <!-- TAB LIBRERIA -->
      <section id="tab-library" style="display: none;">
        <div class="section-header">La tua Libreria</div>
        <div class="track-card" onclick="showToast('Caricamento Preferiti...')">
          <div class="track-info-group">
            <div style="width: 48px; height: 48px; border-radius: 8px; background: linear-gradient(135deg, #450af5, #8e8ee5); display: flex; align-items: center; justify-content: center; font-size: 20px;">❤️</div>
            <div class="track-details">
              <div class="track-title">Brani che ti piacciono</div>
              <div class="track-artist">Playlist dinamica</div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- MINI PLAYER -->
    <div id="mini-player" onclick="openFullscreen()">
      <div class="mini-progress"><div class="mini-progress-fill" id="mini-bar"></div></div>
      <div class="track-info-group">
        <img id="mini-cover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100&h=100&fit=crop" class="track-cover-img" style="width: 38px; height: 38px;" />
        <div class="track-details">
          <div id="mini-title" class="track-title" style="font-size: 13px;">Seleziona un brano</div>
          <div id="mini-artist" class="track-artist" style="font-size: 11px;">DarkSound Pro</div>
        </div>
      </div>
      <button onclick="event.stopPropagation(); togglePlay();" class="play-icon-btn" id="mini-play-btn" style="background:#fff; color:#000;">▶</button>
    </div>

    <!-- BOTTOM NAV -->
    <nav>
      <button class="nav-item active" onclick="switchTab('home', this)">
        <span style="font-size: 18px;">🏠</span>
        <span>Home</span>
      </button>
      <button class="nav-item" onclick="switchTab('search', this)">
        <span style="font-size: 18px;">🔍</span>
        <span>Cerca</span>
      </button>
      <button class="nav-item" onclick="switchTab('library', this)">
        <span style="font-size: 18px;">📚</span>
        <span>Libreria</span>
      </button>
    </nav>
  </div>

  <!-- FULLSCREEN PLAYER -->
  <div id="fullscreen-player">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <button onclick="closeFullscreen()" style="background:none; border:none; color:#fff; font-size: 20px;">✕</button>
      <span style="font-size: 11px; font-weight: 800; letter-spacing: 1px; opacity: 0.6;">IN RIPRODUZIONE</span>
      <div style="width: 20px;"></div>
    </div>

    <img id="full-cover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500&h=500&fit=crop" class="full-artwork" />

    <div>
      <h2 id="full-title" style="font-size: 22px; font-weight: 800; margin-bottom: 4px;">Titolo Brano</h2>
      <p id="full-artist" style="font-size: 15px; color: var(--text-sub);">Nome Artista</p>

      <div style="margin-top: 24px;">
        <input type="range" id="scrubber" value="0" oninput="seekAudio(this.value)" />
        <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-top: 8px;">
          <span id="curr-time">0:00</span>
          <span id="dur-time">0:00</span>
        </div>
      </div>

      <div style="display: flex; justify-content: center; align-items: center; gap: 32px; margin-top: 24px;">
        <button class="play-btn-large" id="full-play-btn" onclick="togglePlay()">▶</button>
      </div>
    </div>
  </div>

  <script>
    const audio = document.getElementById('audio-player');
    let currentTrack = null;
    let isPlaying = false;

    // Brani dimostrativi precaricati con stream diretto e stabile
    const INITIAL_TRACKS = [
      {
        title: "100 Messaggi",
        artist: "Lazza",
        cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&h=300&fit=crop",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
      },
      {
        title: "Blinding Lights",
        artist: "The Weeknd",
        cover: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&h=300&fit=crop",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
      },
      {
        title: "I P' ME, TU P' TE",
        artist: "Geolier",
        cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&h=300&fit=crop",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
      }
    ];

    function renderSongs(tracks, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = tracks.map(t => `
        <div class="track-card ${currentTrack?.title === t.title ? 'playing' : ''}" onclick='playTrack(${JSON.stringify(t)})'>
          <div class="track-info-group">
            <img src="${t.cover}" class="track-cover-img" />
            <div class="track-details">
              <div class="track-title">${t.title}</div>
              <div class="track-artist">${t.artist}</div>
            </div>
          </div>
          <button class="play-icon-btn">▶</button>
        </div>
      `).join('');
    }

    function playTrack(track) {
      currentTrack = track;
      
      // Aggiorna UI
      document.getElementById('mini-title').textContent = track.title;
      document.getElementById('mini-artist').textContent = track.artist;
      document.getElementById('mini-cover').src = track.cover;
      document.getElementById('full-title').textContent = track.title;
      document.getElementById('full-artist').textContent = track.artist;
      document.getElementById('full-cover').src = track.cover;
      document.getElementById('ambient-bg').style.backgroundImage = `url('${track.cover}')`;

      audio.src = track.url;
      audio.play().then(() => {
        setPlayState(true);
      }).catch(err => {
        showToast("Errore di riproduzione audio");
      });

      renderSongs(INITIAL_TRACKS, 'home-songs-list');
    }

    function togglePlay() {
      if (!currentTrack) {
        playTrack(INITIAL_TRACKS[0]);
        return;
      }
      if (audio.paused) {
        audio.play();
        setPlayState(true);
      } else {
        audio.pause();
        setPlayState(false);
      }
    }

    function setPlayState(playing) {
      isPlaying = playing;
      document.getElementById('mini-play-btn').textContent = playing ? '⏸' : '▶';
      document.getElementById('full-play-btn').textContent = playing ? '⏸' : '▶';
    }

    audio.ontimeupdate = () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        document.getElementById('mini-bar').style.width = pct + '%';
        document.getElementById('scrubber').value = pct;
        document.getElementById('curr-time').textContent = formatTime(audio.currentTime);
        document.getElementById('dur-time').textContent = formatTime(audio.duration);
      }
    };

    function seekAudio(val) {
      if (audio.duration) {
        audio.currentTime = (val / 100) * audio.duration;
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function switchTab(tabName, el) {
      ['home', 'search', 'library'].forEach(t => {
        document.getElementById(`tab-${t}`).style.display = t === tabName ? 'block' : 'none';
      });
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
    }

    function searchMusic(query) {
      if (!query.trim()) return;
      showToast("Ricerca in corso...");
      // Risultato simulato per garantire che l'app funzioni sempre senza blocchi server
      const searchResult = [{
        title: query,
        artist: "Risultato Ricerca",
        cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&h=300&fit=crop",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
      }];
      renderSongs(searchResult, 'search-results-list');
    }

    function openFullscreen() { document.getElementById('fullscreen-player').classList.add('open'); }
    function closeFullscreen() { document.getElementById('fullscreen-player').classList.remove('open'); }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    window.onload = () => {
      renderSongs(INITIAL_TRACKS, 'home-songs-list');
    };
  </script>
</body>
</html>
